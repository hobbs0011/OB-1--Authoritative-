<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="description" content="CASA English Student Portal — Natural English Training login for CASA students.">
  <title>CASA English | Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a;
      --bg-elevated: #151528;
      --panel: rgba(17, 22, 32, 0.93);
      --panel-border: rgba(255, 255, 255, 0.10);
      --text: #f8f5ff;
      --muted: #c2cbdc;
      --muted-strong: #dde2ef;
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.14);
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.14);
      --danger: #ef4444;
      --shadow-lg: 0 30px 90px rgba(0, 0, 0, 0.38);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(168, 85, 247, 0.16), transparent 28%),
        radial-gradient(circle at 88% 14%, rgba(245, 158, 11, 0.10), transparent 24%),
        linear-gradient(180deg, #090b12 0%, #0f0f1a 38%, #141625 100%);
      min-height: 100vh;
    }

    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--purple), var(--gold));
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--purple), var(--gold));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.3);
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .brand span {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-soft);
    }

    .form-group input.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
      font-weight: 600;
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--purple), var(--gold));
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .demo-hint {
      margin-top: 20px;
      padding: 14px 18px;
      background: var(--purple-soft);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .demo-hint strong {
      color: var(--gold);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--panel-border);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .spinner { display: block; }
  </style>
</head>
<body class="login-page" data-page="login">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">C</div>
      <h1>CASA English</h1>
      <span>Natural English Training</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="studentCode">Student Code</label>
        <input type="text" id="studentCode" name="studentCode" placeholder="e.g. CASA-2026-001" required>
        <div class="error-msg" id="codeError">Please enter your student code.</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <div class="error-msg" id="pwdError">Incorrect password. Try again.</div>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <span class="btn-text">Enter Portal</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="demo-hint">
      <strong>Demo credentials:</strong><br>
      Code: <strong>CASA-2026-001</strong> &nbsp;|&nbsp; Password: <strong>CASA2026</strong>
    </div>

    <div class="divider">or</div>

    <div class="login-footer">
      <p>Need access? Contact <a href="mailto:mrmichaelhobbs123@gmail.com">your instructor</a></p>
      <p style="margin-top:6px;">KISS Methodology &middot; Two Brains &middot; Active Listening</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var code = document.getElementById('studentCode').value.trim();
      var pwd = document.getElementById('password').value;
      var btn = document.getElementById('loginBtn');
      var codeErr = document.getElementById('codeError');
      var pwdErr = document.getElementById('pwdError');

      codeErr.style.display = 'none';
      pwdErr.style.display = 'none';
      document.getElementById('studentCode').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!code) {
        codeErr.style.display = 'block';
        document.getElementById('studentCode').classList.add('error');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      setTimeout(function() {
        btn.classList.remove('loading');
        btn.disabled = false;

        if (code === 'CASA-2026-001' && pwd === 'CASA2026') {
          window.location.href = 'dashboard.html?student=' + encodeURIComponent(code) + '&name=' + encodeURIComponent('Student');
        } else {
          pwdErr.style.display = 'block';
          document.getElementById('password').classList.add('error');
        }
      }, 800);
    });

    document.getElementById('studentCode').addEventListener('input', function() {
      document.getElementById('codeError').style.display = 'none';
      this.classList.remove('error');
    });

    document.getElementById('password').addEventListener('input', function() {
      document.getElementById('pwdError').style.display = 'none';
      this.classList.remove('error');
    });
  </script>
</body>
</html>
