<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta theme-color content="#0a1929">
  <title>Bluetech Portal — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue-deep: #0a1929;
      --blue-dark: #0d2137;
      --blue-mid: #0f3460;
      --blue: #0056b3;
      --blue-bright: #00a3e0;
      --blue-glow: rgba(0, 163, 224, 0.25);
      --white: #ffffff;
      --white-soft: #e6f2ff;
      --muted: #8aa8c7;
      --panel: rgba(13, 33, 55, 0.92);
      --panel-border: rgba(0, 163, 224, 0.20);
      --success: #22c55e;
      --danger: #ef4444;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--white);
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 163, 224, 0.10), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 86, 179, 0.12), transparent 50%),
        linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-dark) 50%, var(--blue-deep) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-wrap { width: 100%; max-width: 440px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--blue-bright), var(--blue));
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      color: var(--white);
      font-size: 1.8rem;
      margin-bottom: 16px;
      box-shadow: 0 16px 48px rgba(0, 163, 224, 0.30), inset 0 1px 0 rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.02em;
    }
    .brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--white);
    }
    .brand p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
      font-style: italic;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .role-btn {
      padding: 14px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border);
      background: rgba(0, 163, 224, 0.04);
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s;
      text-align: center;
      letter-spacing: 0.03em;
    }
    .role-btn:hover { background: rgba(0, 163, 224, 0.10); color: var(--white); }
    .role-btn.active {
      background: linear-gradient(135deg, rgba(0, 163, 224, 0.25), rgba(0, 86, 179, 0.20));
      color: var(--white);
      border-color: rgba(0, 163, 224, 0.50);
      box-shadow: 0 0 20px rgba(0, 163, 224, 0.15);
    }
    .pin-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .pin-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.04);
      color: var(--white);
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }
    .pin-input:focus {
      border-color: var(--blue-bright);
      box-shadow: 0 0 0 3px rgba(0, 163, 224, 0.15);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, var(--blue-bright), var(--blue));
      color: var(--white);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(0, 163, 224, 0.25);
    }
    .login-btn:hover {
      box-shadow: 0 12px 32px rgba(0, 163, 224, 0.40);
      transform: translateY(-1px);
    }
    .login-error {
      color: var(--danger);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 24px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-logo">B</div>
      <h1>BLUETECH PORTAL</h1>
      <p>Staff Development &amp; Progress Tracking</p>
    </div>
    <div class="card">
      <div class="role-grid">
        <button class="role-btn active" data-role="student" onclick="selectRole('student')">Employee</button>
        <button class="role-btn" data-role="teacher" onclick="selectRole('teacher')">Teacher</button>
        <button class="role-btn" data-role="admin" onclick="selectRole('admin')">Admin</button>
      </div>
      <div class="pin-label" id="pinLabel">Employee PIN</div>
      <select id="studentSelect" class="pin-input" style="text-align:left;letter-spacing:0;display:none;margin-bottom:10px;">
        <option value="huong-bluetech">Huong</option>
        <option value="mai-tram-bluetech">Mai Tram</option>
        <option value="quy-bluetech">Quy</option>
      </select>
      <input type="password" id="pinInput" class="pin-input" placeholder="Enter PIN" autocomplete="off" maxlength="20">
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
      <p class="login-error" id="loginErr"></p>
    </div>
    <p class="footer-note">Bluetech Ingredients Ltd. &middot; Lakeview City, Thu Duc, HCMC</p>
  </div>

  <script>
    const API = 'https://net-pet-ai.mrmichaelhobbs123.workers.dev';
    let selectedRole = 'student';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role));
      const labels = { student: 'Employee PIN', teacher: 'Teacher PIN', admin: 'Admin PIN' };
      document.getElementById('pinLabel').textContent = labels[role] || 'PIN';
      const studentSelect = document.getElementById('studentSelect');
      const pinInput = document.getElementById('pinInput');
      if (role === 'student') {
        studentSelect.style.display = 'block';
        pinInput.placeholder = 'Enter your PIN';
      } else {
        studentSelect.style.display = 'none';
        pinInput.placeholder = 'Enter PIN';
      }
      document.getElementById('loginErr').textContent = '';
    }

    async function doLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const errEl = document.getElementById('loginErr');
      if (!pin) { errEl.textContent = 'Enter your PIN'; return; }
      errEl.textContent = '';
      try {
        if (selectedRole === 'student') {
          const studentId = document.getElementById('studentSelect')?.value || 'bluetech';
          const r = await fetch(`${API}/api/student/checkpin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ studentId, pin })
          });
          const d = await r.json();
          if (!d.ok) { errEl.textContent = d.error || 'Invalid PIN'; return; }
          const sid = d.studentId || studentId;
          localStorage.setItem('bluetech_session', JSON.stringify({ role: 'student', studentId: sid }));
          window.location.replace('/bluetech-' + sid.replace('bluetech-', '') + '/');
        } else if (selectedRole === 'teacher') {
          const r = await fetch(`${API}/api/teacher/checkpin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });
          const d = await r.json();
          if (!d.ok) { errEl.textContent = d.error || 'Invalid PIN'; return; }
          localStorage.setItem('bluetech_session', JSON.stringify({ role: 'teacher' }));
          window.location.replace('/bluetech-teacher/');
        } else {
          const r = await fetch(`${API}/api/parent/checkpin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });
          const d = await r.json();
          if (!d.ok) { errEl.textContent = d.error || 'Invalid PIN'; return; }
          localStorage.setItem('bluetech_session', JSON.stringify({ role: 'admin' }));
          window.location.replace('/bluetech-admin/');
        }
      } catch (e) {
        errEl.textContent = 'Network error';
      }
    }

    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
