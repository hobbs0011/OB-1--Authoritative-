<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Natural English Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      padding: 24px;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .login-card .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-card .brand img {
      width: 48px;
      height: 48px;
    }
    .login-card .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      margin: 0;
    }
    .login-card .brand span {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      border-color: var(--purple);
    }
    .form-group input.error {
      border-color: var(--danger);
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 4px;
      display: none;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #a855f7, #f59e0b);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .login-footer a {
      color: var(--purple);
      text-decoration: none;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--purple);
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body class="login-page" data-page="login">
  <div class="login-card">
    <a class="back-link" href="index.html">← Back to Home</a>
    <div class="brand">
      <img src="assets/brand/NET-PHXRISING-LOGO.webp" alt="NET logo" width="48" height="48">
      <div>
        <h1>Login</h1>
        <span>Natural English Training</span>
      </div>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Class Code / Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your class code or email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <div class="error-msg" id="pwdError">Incorrect password. Try again.</div>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Enter</button>
    </form>
    <div class="login-footer">
      <p><a href="index.html#section1">Need an assessment?</a> · <a href="mailto:hobbs@naturalenglishtraining.com">Contact support</a></p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Entering…';
      setTimeout(function() {
        btn.textContent = 'Enter';
        btn.disabled = false;
        alert('Login functionality will be connected to NET-PET-AI soon. For now, please contact hobbs@naturalenglishtraining.com for access.');
      }, 600);
    });
  </script>
</body>
</html>
