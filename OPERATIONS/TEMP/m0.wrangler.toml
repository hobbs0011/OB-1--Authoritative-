name = "obi-m0"
main = "src/m0.ts"
compatibility_date = "2026-03-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "PHOENIX_LEDGER"
class_name = "PhoenixLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoenixLedger"]

[[queues.producers]]
binding = "SUBAGENT_QUEUE"
queue = "obi-subagent-queue"

[[queues.consumers]]
queue = "obi-subagent-queue"
max_batch_size = 10
max_batch_timeout = 5

[vars]
RUNTIME_PRIMARY = "cloudflare"
MASTER_SYNC_REPO = "hobbs-lab/Phoenix-Rise-Immortalize-"
MASTER_SYNC_PATH = "MASTER-SYNC.md"

# Set via `wrangler secret put`:
# DEATHSTAR_INGEST_KEY
# NOTION_TOKEN
# GITHUB_TOKEN
