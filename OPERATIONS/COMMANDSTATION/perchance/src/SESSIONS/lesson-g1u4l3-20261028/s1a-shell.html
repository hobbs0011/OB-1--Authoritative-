<!DOCTYPE html>
<html lang="en">
<head>
<meta viewport="width=device-width, initial-scale=1">
<style>
:root {
  --neon-purple: #a855f7;
  --gold: #f59e0b;
  --deep-dark: #0f0f1a;
}
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--deep-dark);
  color: var(--neon-purple);
}
.dialogue-block {
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--gold);
  padding: 1rem;
  margin: 1rem;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="dialogue-block">
  <p class="speaker">Dd</p>
  <p>Dd is for dance. Say it with me: dance, dino, dot.</p>
  <p><button data-answer="true">Begin Your Journey</button></p>
</div>
<div class="vocab-list">
  <div class="vocab-item">dance</div>
  <div class="vocab-item">dino</div>
  <div class="vocab-item">dot</div>
</div>
