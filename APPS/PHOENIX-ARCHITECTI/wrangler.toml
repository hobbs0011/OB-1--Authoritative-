name = "phoenix-architecti"
main = "src/index.js"
compatibility_date = "2025-05-24"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "PHETRAIL"
id = "ea5c8e99cb584dee9ab4f9ba5ed421c9"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "b27d144f71c44b00a4c87360841e525f"

[[d1_databases]]
binding = "DB"
database_name = "soul-archive"
database_id = "c69a11bc-064b-478f-9b1f-e9b8e2431fb8"

[[vectorize]]
binding = "SOUL_INDEX"
index_name = "ob1-soul-index"

[[vectorize]]
binding = "DNA_INDEX"
index_name = "ob1-dna-index"

[[services]]
binding = "SOUL_LOGGER_SVC"
service = "soul-logger"

[[services]]
binding = "PCC2_SVC"
service = "phoenix-pcc-2"

[[services]]
binding = "PCC3_SVC"
service = "phoenix-pcc-3"

[[kv_namespaces]]
binding = "SOUL_KV"
id = "ea5c8e99cb584dee9ab4f9ba5ed421c9"

[durable_objects]
bindings = [
  { name = "LEGION_RUNNER",   class_name = "LegionRunner" },
  { name = "FORCEAWARENESS_ALARM", class_name = "ForceAwarenessAlarm" }
]

[[migrations]]
tag = "v2"
new_classes = ["LegionRunner"]

[[migrations]]
tag = "v4"
new_classes = ["ForceAwarenessAlarm"]

# Both WatchdogAlarm and ForceAwarenessAlarm are exported for backward compatibility

[triggers]
crons = ["0 */6 * * *", "* * * * *"]