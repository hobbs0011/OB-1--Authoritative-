<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net-Pet-AI Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .loadingio-spinner-spinner-eqs5rnz2i9g {
            width: 40px;
            height: 40px;
            display: inline-block;
            overflow: hidden;
            background: none;
        }
        .ldio-5g1v2l9f2oz div {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: ldio-5g1v2l9f2oz 1.2s linear infinite;
            left: 5px;
            top: 5px;
        }
        @keyframes ldio-5g1v2l9f2oz {
            0% { transform: rotate(0deg) }
            100% { transform: rotate(360deg) }
        }
    </style>
</head>
<body class="bg-[#111827] text-[#f3f4f6] min-h-screen">
    <!-- Password Gate -->
    <div id="password-gate" class="fixed inset-0 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm z-50">
        <div class="bg-[#1f2937] p-8 rounded-lg w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin PIN</h2>
            <form id="pin-form">
                <input type="password" id="pin-input" class="w-full px-4 py-2 mb-4 bg-[#374151] border border-[#4b5563] rounded text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#6366f1]" placeholder="Enter PIN" required>
                <button type="submit" class="w-full bg-[#6366f1] hover:bg-[#4f46e5] text-white font-bold py-2 px-4 rounded">Unlock</button>
                <p id="pin-error" class="mt-2 text-red-500 text-sm hidden"></p>
            </form>
        </div>
    </div>

    <!-- Dashboard (initially hidden) -->
    <div id="dashboard" class="hidden p-6">
        <!-- Lock button at top-right -->
        <button id="lock-button" class="absolute top-4 right-4 bg-[#6366f1] hover:bg-[#4f46e5] text-white font-bold py-1 px-3 rounded">
            Lock
        </button>

        <div class="mt-10 space-y-8">
            <!-- DAU Chart -->
            <div>
                <h3 class="text-xl font-bold mb-4">Daily Active Users (Last 14 Days)</h3>
                <div id="dau-loader" class="flex items-center justify-center">
                    <div class="loadingio-spinner-spinner-eqs5rnz2i9g">
                        <div class="ldio-5g1v2l9f2oz"><div></div></div>
                    </div>
                </div>
                <canvas id="dau-chart" class="hidden"></canvas>
                <div id="dau-error" class="mt-2 text-red-500 text-sm hidden"></div>
            </div>

            <!-- Vocab Mastery Funnel -->
            <div>
                <h3 class="text-xl font-bold mb-4">Vocab Mastery Distribution</h3>
                <div class="flex mb-4">
                    <label for="student-select" class="mr-2">Student:</label>
                    <select id="student-select" class="px-3 py-1 bg-[#374151] border border-[#4b5563] rounded text-white">
                        <option value="huong">Huong</option>
                        <option value="mai-tram">Mai Tram</option>
                        <option value="quy">Quy</option>
                    </select>
                </div>
                <div id="vocab-loader" class="flex items-center justify-center">
                    <div class="loadingio-spinner-spinner-eqs5rnz2i9g">
                        <div class="ldio-5g1v2l9f2oz"><div></div></div>
                    </div>
                </div>
                <canvas id="vocab-chart" class="hidden"></canvas>
                <div id="vocab-error" class="mt-2 text-red-500 text-sm hidden"></div>
            </div>

            <!-- Voice Score Distribution (MAE) -->
            <div>
                <h3 class="text-xl font-bold mb-4">Voice Score Distribution (MAE)</h3>
                <div id="voice-loader" class="flex items-center justify-center">
                    <div class="loadingio-spinner-spinner-eqs5rnz2i9g">
                        <div class="ldio-5g1v2l9f2oz"><div></div></div>
                    </div>
                </div>
                <canvas id="voice-chart" class="hidden"></canvas>
                <div id="voice-error" class="mt-2 text-red-500 text-sm hidden"></div>
            </div>

            <!-- Streak Health -->
            <div>
                <h3 class="text-xl font-bold mb-4">Streak Health</h3>
                <div id="streak-loader" class="flex items-center justify-center">
                    <div class="loadingio-spinner-spinner-eqs5rnz2i9g">
                        <div class="ldio-5g1v2l9f2oz"><div></div></div>
                    </div>
                </div>
                <div id="streak-cards" class="grid grid-cols-2 gap-4 hidden"></div>
                <div id="streak-error" class="mt-2 text-red-500 text-sm hidden"></div>
            </div>

            <!-- Anti-cheat Summary Table -->
            <div>
                <h3 class="text-xl font-bold mb-4">Anti-cheat Summary</h3>
                <div id="anticheat-loader" class="flex items-center justify-center">
                    <div class="loadingio-spinner-spinner-eqs5rnz2i9g">
                        <div class="ldio-5g1v2l9f2oz"><div></div></div>
                    </div>
                </div>
                <div id="anticheat-table" class="hidden">
                    <table class="min-w-full bg-[#1f2937] rounded-lg overflow-hidden">
                        <thead class="bg-[#374151]">
                            <tr>
                                <th class="px-4 py-2 text-left">Student</th>
                                <th class="px-4 py-2 text-left">Date</th>
                                <th class="px-4 py-2 text-left">Tab Switch Count</th>
                                <th class="px-4 py-2 text-left">Interaction Ratio</th>
                                <th class="px-4 py-2 text-left">Status</th>
                            </tr>
                        </thead>
                        <tbody id="anticheat-tbody"></tbody>
                    </table>
                </div>
                <div id="anticheat-error" class="mt-2 text-red-500 text-sm hidden"></div>
            </div>
        </div>
    </div>

    <script>
        // State
        let dauChart = null;
        let vocabChart = null;
        let voiceChart = null;

        // DOM Elements
        const passwordGate = document.getElementById('password-gate');
        const dashboard = document.getElementById('dashboard');
        const pinForm = document.getElementById('pin-form');
        const pinInput = document.getElementById('pin-input');
        const pinError = document.getElementById('pin-error');
        const lockButton = document.getElementById('lock-button');

        // Loader and error elements
        const dauLoader = document.getElementById('dau-loader');
        const dauChartEl = document.getElementById('dau-chart');
        const dauError = document.getElementById('dau-error');
        const vocabLoader = document.getElementById('vocab-loader');
        const vocabChartEl = document.getElementById('vocab-chart');
        const vocabError = document.getElementById('vocab-error');
        const voiceLoader = document.getElementById('voice-loader');
        const voiceChartEl = document.getElementById('voice-chart');
        const voiceError = document.getElementById('voice-error');
        const streakLoader = document.getElementById('streak-loader');
        const streakCards = document.getElementById('streak-cards');
        const streakError = document.getElementById('streak-error');
        const anticheatLoader = document.getElementById('anticheat-loader');
        const anticheatTable = document.getElementById('anticheat-table');
        const anticheatError = document.getElementById('anticheat-error');
        const anticheatTbody = document.getElementById('anticheat-tbody');
        const studentSelect = document.getElementById('student-select');

        // Helper functions
        const showLoader = (loaderEl) => {
            loaderEl.classList.remove('hidden');
        };
        const hideLoader = (loaderEl) => {
            loaderEl.classList.add('hidden');
        };
        const showError = (errorEl, message) => {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        };
        const hideError = (errorEl) => {
            errorEl.classList.add('hidden');
            errorEl.textContent = '';
        };

        // PIN handling
        pinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pin = pinInput.value.trim();
            if (pin === 'net2026admin') {
                pinError.classList.add('hidden');
                passwordGate.classList.add('hidden');
                dashboard.classList.remove('hidden');
                loadAllData();
            } else {
                showError(pinError, 'Invalid PIN');
                pinInput.value = '';
            }
        });

        lockButton.addEventListener('click', () => {
            passwordGate.classList.remove('hidden');
            dashboard.classList.add('hidden');
            pinInput.value = '';
            hideError(pinError);
            // Reset charts and data
            if (dauChart) dauChart.destroy();
            if (vocabChart) vocabChart.destroy();
            if (voiceChart) voiceChart.destroy();
            dauChart = null;
            vocabChart = null;
            voiceChart = null;
            dauChartEl.classList.add('hidden');
            vocabChartEl.classList.add('hidden');
            voiceChartEl.classList.add('hidden');
            streakCards.classList.add('hidden');
            anticheatTable.classList.add('hidden');
        });

        // Data loading functions
        const loadAllData = async () => {
            try {
                await Promise.all([
                    loadDAUData(),
                    loadVocabData(),
                    loadVoiceData(),
                    loadStreakData(),
                    loadAnticheatData()
                ]);
            } catch (err) {
                console.error('Failed to load some data:', err);
            }
        };

        const loadDAUData = async () => {
            showLoader(dauLoader);
            hideError(dauError);
            try {
                const response = await fetch('/api/metrics/dau?days=14');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                // Expecting { labels: [...], data: [...] }
                const ctx = dauChartEl.getContext('2d');
                if (dauChart) dauChart.destroy();
                dauChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Daily Active Users',
                            data: data.data,
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.2)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { backgroundColor: '#1f2937' }
                        },
                        scales: {
                            x: { grid: { display: false }, color: '#9ca3af' },
                            y: { grid: { color: '#374151' }, color: '#9ca3af', beginAtZero: true }
                        }
                    }
                });
                dauChartEl.classList.remove('hidden');
            } catch (err) {
                showError(dauError, `Failed to load DAU data: ${err.message}`);
            } finally {
                hideLoader(dauLoader);
            }
        };

        const loadVocabData = async () => {
            showLoader(vocabLoader);
            hideError(vocabError);
            try {
                const studentId = studentSelect.value;
                const response = await fetch(`/api/vocab/list?studentId=${studentId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const vocabItems = await response.json();
                // Calculate mastery distribution (0-20%, 21-40%, 41-60%, 61-80%, 81-100%)
                const buckets = [0, 0, 0, 0, 0];
                vocabItems.forEach(item => {
                    const score = item.mastery || 0; // Assuming mastery field exists
                    if (score <= 20) buckets[0]++;
                    else if (score <= 40) buckets[1]++;
                    else if (score <= 60) buckets[2]++;
                    else if (score <= 80) buckets[3]++;
                    else buckets[4]++;
                });
                const ctx = vocabChartEl.getContext('2d');
                if (vocabChart) vocabChart.destroy();
                vocabChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['0-20%', '21-40%', '41-60%', '61-80%', '81-100%'],
                        datasets: [{
                            label: 'Mastery Distribution',
                            data: buckets,
                            backgroundColor: [
                                '#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { backgroundColor: '#1f2937' }
                        },
                        scales: {
                            x: { grid: { display: false }, color: '#9ca3af' },
                            y: { grid: { color: '#374151' }, color: '#9ca3af', beginAtZero: true }
                        }
                    }
                });
                vocabChartEl.classList.remove('hidden');
            } catch (err) {
                showError(vocabError, `Failed to load vocab data: ${err.message}`);
            } finally {
                hideLoader(vocabLoader);
            }
        };

        // Update vocab chart when student changes
        studentSelect.addEventListener('change', loadVocabData);

        const loadVoiceData = async () => {
            showLoader(voiceLoader);
            hideError(voiceError);
            try {
                // Assuming endpoint returns array of sessions with mae scores
                const response = await fetch('/api/voice/sessions');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const sessions = await response.json();
                // Extract MAE scores and create histogram (0-100 range, 10 bins)
                const maeScores = sessions.map(s => s.mae || 0);
                const bins = Array(10).fill(0);
                maeScores.forEach(score => {
                    const binIndex = Math.floor(score / 10);
                    if (binIndex >= 0 && binIndex < 10) {
                        bins[binIndex]++;
                    }
                });
                const ctx = voiceChartEl.getContext('2d');
                if (voiceChart) voiceChart.destroy();
                voiceChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['0-9', '10-19', '20-29', '30-39', '40-49', '50-59', '60-69', '70-79', '80-89', '90-100'],
                        datasets: [{
                            label: 'MAE Score Distribution',
                            data: bins,
                            backgroundColor: '#6366f1',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { backgroundColor: '#1f2937' }
                        },
                        scales: {
                            x: { grid: { display: false }, color: '#9ca3af' },
                            y: { grid: { color: '#374151' }, color: '#9ca3af', beginAtZero: true }
                        }
                    }
                });
                voiceChartEl.classList.remove('hidden');
            } catch (err) {
                showError(voiceError, `Failed to load voice data: ${err.message}`);
            } finally {
                hideLoader(voiceLoader);
            }
        };

        const loadStreakData = async () => {
            showLoader(streakLoader);
            hideError(streakError);
            try {
                // Assuming endpoint returns array of { student: string, streak: number }
                const response = await fetch('/api/streaks');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const streaks = await response.json();
                // Map to our six students
                const students = ['Huong', 'Mai Tram', Quy', 'Quang', 'Quan', 'Lam'];
                const streakMap = {};
                streaks.forEach(s => {
                    streakMap[s.student] = s.streak;
                });
                // Clear and populate cards
                streakCards.innerHTML = '';
                students.forEach(name => {
                    const streak = streakMap[name] || 0;
                    let badgeClass = 'bg-[#10b981]'; // healthy
                    let badgeText = 'Healthy';
                    if (streak >= 3 && streak <= 6) {
                        badgeClass = 'bg-[#f59e0b]';
                        badgeText = 'Warning';
                    } else if (streak < 3) {
                        badgeClass = 'bg-[#ef4444]';
                        badgeText = 'At-Risk';
                    }
                    const card = document.createElement('div');
                    card.className = 'bg-[#1f2937] p-4 rounded-lg';
                    card.innerHTML = `
                        <h4 class="font-bold mb-2">${name}</h4>
                        <p class="text-[18px] font-bold mb-2">${streak} days</p>
                        <span class="px-2 py-1 text-xs rounded ${badgeClass}">${badgeText}</span>
                    `;
                    streakCards.appendChild(card);
                });
                streakCards.classList.remove('hidden');
            } catch (err) {
                showError(streakError, `Failed to load streak data: ${err.message}`);
            } finally {
                hideLoader(streakLoader);
            }
        };

        const loadAnticheatData = async () => {
            showLoader(anticheatLoader);
            hideError(anticheatError);
            try {
                const response = await fetch('/api/anticheat/history');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const history = await response.json();
                // Clear and populate table
                anticheatTbody.innerHTML = '';
                history.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-t border-[#374151]';
                    tr.innerHTML = `
                        <td class="px-4 py-2">${row.student}</td>
                        <td class="px-4 py-2">${row.date}</td>
                        <td class="px-4 py-2">${row.tabSwitchCount}</td>
                        <td class="px-4 py-2">${row.interactionRatio.toFixed(2)}</td>
                        <td class="px-4 py-2">
                            <span class="px-2 py-1 text-xs rounded 
                                ${row.status === 'FLAGGED' ? 'bg-[#ef4444]' : 'bg-[#10b981]'}">
                                ${row.status}
                            </span>
                        </td>
                    `;
                    anticheatTbody.appendChild(tr);
                });
                anticheatTable.classList.remove('hidden');
            } catch (err) {
                showError(anticheatError, `Failed to load anti-cheat data: ${err.message}`);
            } finally {
                hideLoader(anticheatLoader);
            }
        };
    </script>
</body>
</html>
