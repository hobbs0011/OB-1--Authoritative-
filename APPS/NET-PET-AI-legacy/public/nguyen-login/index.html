<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta theme-color content="#1a120b">
  <title>Nguyen Family Portal — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-deep: #1a120b;
      --wood-dark: #2d1810;
      --wood-mid: #3d2817;
      --wood-light: #5c3d2e;
      --gold: #c9a961;
      --gold-light: #d4b87a;
      --gold-soft: rgba(201, 169, 97, 0.12);
      --cream: #f5f0e8;
      --cream-muted: #d9d0c3;
      --text: #f5f0e8;
      --muted: #b8a99a;
      --panel: rgba(30, 20, 14, 0.92);
      --panel-border: rgba(201, 169, 97, 0.18);
      --success: #7d9b76;
      --danger: #a85454;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text);
      background:
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px),
        radial-gradient(ellipse at 20% 20%, rgba(201, 169, 97, 0.08), transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(92, 61, 46, 0.15), transparent 50%),
        linear-gradient(135deg, #1a120b 0%, #2d1810 40%, #1a120b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--gold), #8b6f3a);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--wood-deep);
      font-size: 1.6rem;
      margin-bottom: 16px;
      box-shadow: 0 12px 40px rgba(201, 169, 97, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
      border: 2px solid rgba(201, 169, 97, 0.3);
    }
    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--cream);
    }
    .brand p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(201, 169, 97, 0.08);
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .role-btn {
      padding: 14px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border);
      background: rgba(201, 169, 97, 0.04);
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s;
      text-align: center;
      letter-spacing: 0.03em;
    }
    .role-btn.active {
      background: linear-gradient(135deg, rgba(201, 169, 97, 0.25), rgba(139, 111, 58, 0.2));
      color: var(--gold-light);
      border-color: rgba(201, 169, 97, 0.5);
      box-shadow: 0 8px 24px rgba(201, 169, 97, 0.15);
    }
    .role-btn:hover:not(.active) {
      border-color: rgba(201, 169, 97, 0.35);
      color: var(--cream);
      background: rgba(201, 169, 97, 0.08);
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: 'Inter', sans-serif;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .field input:focus {
      border-color: rgba(201, 169, 97, 0.5);
      box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.08);
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, var(--gold), #8b6f3a);
      color: var(--wood-deep);
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(201, 169, 97, 0.25);
      transition: all 0.2s;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 36px rgba(201, 169, 97, 0.35);
      background: linear-gradient(135deg, var(--gold-light), #9b7f4a);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 16px;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-logo">N</div>
      <h1>Nguyen Family Portal</h1>
      <p>English + Career Progress Tracker</p>
    </div>

    <div class="card">
      <div class="role-grid">
        <button class="role-btn active" data-role="parent" onclick="selectRole('parent', this)">Parents</button>
        <button class="role-btn" data-role="quang" onclick="selectRole('quang', this)">Quang</button>
        <button class="role-btn" data-role="quan" onclick="selectRole('quan', this)">Quan</button>
      </div>

      <div class="field">
        <label id="pinLabel">Parent PIN</label>
        <input type="password" id="pinInput" placeholder="Enter PIN" autocomplete="off">
      </div>

      <button class="submit-btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
      <div class="error" id="loginError"></div>
    </div>

    <p class="hint">Use the PIN provided by your teacher.</p>
  </div>

  <script>
    const API = 'https://net-pet-ai.mrmichaelhobbs123.workers.dev';
    let currentRole = 'parent';

    function selectRole(role, btn) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const label = document.getElementById('pinLabel');
      const input = document.getElementById('pinInput');
      if (role === 'parent') {
        label.textContent = 'Parent PIN';
        input.placeholder = 'Enter parent PIN';
      } else if (role === 'quang') {
        label.textContent = "Quang's PIN";
        input.placeholder = "Enter Quang's PIN";
      } else {
        label.textContent = "Quan's PIN";
        input.placeholder = "Enter Quan's PIN";
      }
    }

    async function handleLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errorEl.textContent = '';
      if (!pin) { errorEl.textContent = 'Please enter your PIN.'; return; }
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        let ok = false;
        if (currentRole === 'parent') {
          const r = await fetch(`${API}/api/parent/checkpin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });
          const d = await r.json();
          ok = d.ok;
        } else {
          const studentId = currentRole === 'quang' ? 'quang-bluetech' : 'quan-bluetech';
          const r = await fetch(`${API}/api/student/checkpin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ studentId, pin })
          });
          const d = await r.json();
          ok = d.ok;
        }
        if (ok) {
          localStorage.setItem('nguyen_session', JSON.stringify({ role: currentRole, ts: Date.now() }));
          const dest = currentRole === 'parent' ? '/nguyen-parent/' : `/nguyen-${currentRole}/`;
          window.location.replace(dest);
        } else {
          errorEl.textContent = 'Invalid PIN. Please try again.';
        }
      } catch (e) {
        errorEl.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.getElementById('pinInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
