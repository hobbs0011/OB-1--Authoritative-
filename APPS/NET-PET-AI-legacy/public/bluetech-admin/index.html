<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta theme-color content="#0a1929">
  <title>Bluetech — Admin Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue-deep: #0a1929;
      --blue-dark: #0d2137;
      --blue-mid: #0f3460;
      --blue: #0056b3;
      --blue-bright: #00a3e0;
      --blue-glow: rgba(0, 163, 224, 0.25);
      --white: #ffffff;
      --white-soft: #e6f2ff;
      --muted: #8aa8c7;
      --panel: rgba(13, 33, 55, 0.93);
      --panel-border: rgba(0, 163, 224, 0.18);
      --success: #22c55e;
      --danger: #ef4444;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--white);
      background:
        radial-gradient(circle at 12% 18%, rgba(0, 163, 224, 0.10), transparent 28%),
        radial-gradient(circle at 88% 14%, rgba(0, 86, 179, 0.10), transparent 24%),
        linear-gradient(180deg, #090e17 0%, #0a1929 38%, #0d2137 100%);
      min-height: 100vh;
    }
    .dashboard { max-width: 1200px; margin: 0 auto; padding: 40px 28px 80px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 0; border-bottom: 1px solid var(--panel-border);
      margin-bottom: 36px;
    }
    .topbar-brand { display: flex; align-items: center; gap: 14px; }
    .topbar-logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--blue-bright), var(--blue));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-weight: 800; color: #fff;
      font-size: 1.1rem; box-shadow: 0 8px 24px rgba(0, 163, 224, 0.25);
    }
    .topbar-title h1 {
      font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800;
      letter-spacing: 0.04em;
    }
    .topbar-title span {
      font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em;
    }
    .logout-btn {
      padding: 10px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03);
      color: var(--muted); font-family: 'Outfit', sans-serif; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { border-color: rgba(239,68,68,0.4); color: var(--danger); }
    .welcome-banner {
      background: linear-gradient(135deg, rgba(0, 163, 224, 0.14), rgba(0, 86, 179, 0.10));
      border: 1px solid rgba(0, 163, 224, 0.35);
      border-radius: var(--radius-lg); padding: 32px 36px;
      margin-bottom: 32px; position: relative; overflow: hidden;
    }
    .welcome-banner::before {
      content: ''; position: absolute; top: 0; right: 0;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(0, 163, 224, 0.12), transparent 70%);
      pointer-events: none;
    }
    .welcome-banner h2 {
      font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 800;
      margin-bottom: 8px; position: relative; z-index: 1;
    }
    .welcome-banner p {
      color: var(--muted); font-size: 1rem; position: relative; z-index: 1;
      max-width: 700px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 32px; }
    .card {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg); padding: 28px; position: relative; overflow: hidden;
    }
    .card-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
      padding-bottom: 16px; border-bottom: 1px solid var(--panel-border);
    }
    .card-icon {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; background: rgba(0, 163, 224, 0.10); color: var(--blue-bright);
    }
    .card-header h3 {
      font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--white-soft);
    }
    .student-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--panel-border);
    }
    .student-row:last-child { border-bottom: none; }
    .student-name { font-weight: 600; }
    .student-meta { font-size: 0.82rem; color: var(--muted); }
    .progress-pill {
      font-size: 0.75rem; font-weight: 700; padding: 4px 12px;
      border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase;
      font-family: 'Outfit', sans-serif;
    }
    .pill-ok { background: rgba(34,197,94,0.12); color: var(--success); border: 1px solid rgba(34,197,94,0.25); }
    .pill-warn { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
    .pill-bad { background: rgba(239,68,68,0.12); color: var(--danger); border: 1px solid rgba(239,68,68,0.25); }
    .task-table { width: 100%; border-collapse: collapse; }
    .task-table th, .task-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--panel-border); font-size: 0.9rem; }
    .task-table th { font-family: 'Outfit', sans-serif; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.95rem; }
    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">B</div>
        <div class="topbar-title">
          <h1>Bluetech Admin</h1>
          <span>View Only — Program Overview</span>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>

    <div class="welcome-banner">
      <h2>Admin Overview</h2>
      <p>Monitor employee progress across the Bluetech English program. This view is read-only.</p>
      <button class="btn-primary" onclick="notifyIncomplete()" style="margin-top:16px;background:linear-gradient(135deg, #f59e0b, #d97706);">Notify Incomplete Tasks</button>
      <p id="adminNotifyStatus" class="status-msg" style="margin-top:10px;"></p>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-header">
          <div class="card-icon">👥</div>
          <h3>Employee Summary</h3>
        </div>
        <div id="rosterList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-icon">📈</div>
          <h3>Program Stats</h3>
        </div>
        <div id="statsArea">
          <div class="empty-state">Loading stats...</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">📋</div>
        <h3>All Active Tasks</h3>
      </div>
      <div id="taskTable">
        <div class="empty-state">Loading tasks...</div>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://net-pet-ai.mrmichaelhobbs123.workers.dev';
    const STUDENTS = [
      { id: 'huong-bluetech', name: 'Huong' },
      { id: 'mai-tram-bluetech', name: 'Mai Tram' },
      { id: 'quy-bluetech', name: 'Quy' }
    ];

    function requireAuth() {
      const session = localStorage.getItem('bluetech_session');
      if (!session) { window.location.replace('/bluetech-login/'); return false; }
      const data = JSON.parse(session);
      if (data.role !== 'admin') { window.location.replace('/bluetech-login/'); return false; }
      return true;
    }

    function logout() {
      localStorage.removeItem('bluetech_session');
      window.location.replace('/bluetech-login/');
    }

    async function loadRoster() {
      if (!requireAuth()) return;
      const container = document.getElementById('rosterList');
      try {
        const results = await Promise.all(STUDENTS.map(async s => {
          const r = await fetch(`${API}/api/tasks/current?studentId=${s.id}`);
          const d = await r.json();
          const tasks = d.tasks || [];
          const total = tasks.length;
          const done = tasks.filter(t => t.status === 'completed').length;
          const pct = total ? Math.round((done / total) * 100) : 0;
          const pill = pct >= 80 ? 'pill-ok' : pct >= 40 ? 'pill-warn' : 'pill-bad';
          return { ...s, total, done, pct, pill };
        }));
        container.innerHTML = results.map(r => `
          <div class="student-row">
            <div>
              <div class="student-name">${r.name}</div>
              <div class="student-meta">${r.done}/${r.total} tasks complete</div>
            </div>
            <span class="progress-pill ${r.pill}">${r.pct}%</span>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<div class="empty-state">Failed to load roster.</div>';
      }
    }

    async function loadStats() {
      if (!requireAuth()) return;
      const container = document.getElementById('statsArea');
      try {
        const results = await Promise.all(STUDENTS.map(async s => {
          const r = await fetch(`${API}/api/tasks/history?studentId=${s.id}&weeks=4`);
          const d = await r.json();
          const weeks = d.weeks || [];
          let totalTasks = 0, completedTasks = 0, totalMinutes = 0;
          weeks.forEach(w => {
            (w.tasks || []).forEach(t => {
              totalTasks++;
              if (t.status === 'completed') completedTasks++;
              totalMinutes += t.todayLog?.minutesSpent || 0;
            });
          });
          return { name: s.name, totalTasks, completedTasks, totalMinutes, weeks: weeks.length };
        }));
        const totals = results.reduce((acc, r) => {
          acc.tasks += r.totalTasks; acc.done += r.completedTasks; acc.mins += r.totalMinutes; return acc;
        }, { tasks: 0, done: 0, mins: 0 });
        container.innerHTML = `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;">
            <div style="text-align:center;">
              <div style="font-size:1.8rem;font-weight:800;color:var(--blue-bright);">${totals.tasks}</div>
              <div style="font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Total Tasks</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:1.8rem;font-weight:800;color:var(--success);">${totals.done}</div>
              <div style="font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Completed</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:1.8rem;font-weight:800;color:var(--white);">${totals.mins}</div>
              <div style="font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Minutes Logged</div>
            </div>
          </div>
        `;
      } catch (e) {
        container.innerHTML = '<div class="empty-state">Failed to load stats.</div>';
      }
    }

    async function loadTasks() {
      if (!requireAuth()) return;
      const container = document.getElementById('taskTable');
      try {
        const allTasks = [];
        for (const s of STUDENTS) {
          const r = await fetch(`${API}/api/tasks/current?studentId=${s.id}`);
          const d = await r.json();
          (d.tasks || []).forEach(t => {
            allTasks.push({ student: s.name, ...t });
          });
        }
        if (!allTasks.length) {
          container.innerHTML = '<div class="empty-state">No active tasks.</div>';
          return;
        }
        container.innerHTML = `
          <table class="task-table">
            <thead><tr><th>Employee</th><th>Task</th><th>Category</th><th>Status</th><th>Due</th></tr></thead>
            <tbody>${allTasks.map(t => `
              <tr>
                <td>${escapeHtml(t.student)}</td>
                <td>${escapeHtml(t.title)}</td>
                <td>${escapeHtml(t.category || 'general')}</td>
                <td>${t.status === 'completed' ? '✓ Done' : 'Pending'}</td>
                <td>${t.dueDate || '—'}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        `;
      } catch (e) {
        container.innerHTML = '<div class="empty-state">Failed to load tasks.</div>';
      }
    }

    async function notifyIncomplete() {
      const statusEl = document.getElementById('adminNotifyStatus');
      statusEl.textContent = 'Sending notifications...'; statusEl.style.color = 'var(--muted)';
      try {
        const r = await fetch(`${API}/api/admin/notify-incomplete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Key': 'ob1-sov100' },
          body: JSON.stringify({})
        });
        const d = await r.json();
        if (d.ok) {
          const count = (d.results || []).filter(r => !r.skipped).length;
          statusEl.textContent = `Notifications sent for ${count} student(s)`;
          statusEl.style.color = 'var(--success)';
        } else {
          statusEl.textContent = d.error || 'Failed';
          statusEl.style.color = 'var(--danger)';
        }
      } catch (e) {
        statusEl.textContent = 'Network error';
        statusEl.style.color = 'var(--danger)';
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    if (requireAuth()) { loadRoster(); loadStats(); loadTasks(); }
  </script>
</body>
</html>
