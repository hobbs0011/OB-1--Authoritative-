<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueTech — Staff English Practice</title>
  <style>
    body { font-family: sans-serif; max-width: 920px; margin: 40px auto; padding: 0 16px; background: #f9f9f9; }
    h1 { color: #1e293b; font-size: 1.4rem; }
    .subtitle { color: #64748b; margin-bottom: 24px; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    th { background: #1e293b; color: white; padding: 10px 14px; text-align: left; font-size: 0.8rem; white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem; }
    tr:last-child td { border-bottom: none; }
    .streak-active { color: #16a34a; font-weight: 600; }
    .streak-dead { color: #dc2626; }
    .level { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .fluency-high { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .fluency-mid  { background: #fef9c3; color: #854d0e; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .fluency-low  { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .fluency-none { color: #94a3b8; font-size: 0.78rem; }
    .topic { color: #475569; font-size: 0.82rem; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topic-none { color: #cbd5e1; font-size: 0.78rem; }
    .barge { color: #7c3aed; font-size: 0.82rem; }
    #error { color: #dc2626; margin-top: 16px; }
    #loading { color: #64748b; }
  </style>
</head>
<body>
  <h1>BlueTech — English Practice Tracker</h1>
  <p class="subtitle">Live data · Updated each session</p>
  <div id="loading">Loading…</div>
  <div id="error" hidden></div>
  <table id="tbl" hidden>
    <thead><tr>
      <th>Employee</th>
      <th>Level</th>
      <th>Streak</th>
      <th>This Week</th>
      <th>Total</th>
      <th>Last Practice</th>
      <th>Last Topic</th>
      <th>Fluency</th>
      <th>Confidence</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <script>
    const KEY = new URLSearchParams(location.search).get("key") || "";
    fetch("/api/admin/student-activity", { headers: { "x-admin-key": KEY } })
      .then(r => r.json())
      .then(data => {
        document.getElementById("loading").hidden = true;
        if (data.error) { document.getElementById("error").textContent = data.error; document.getElementById("error").hidden = false; return; }
        const tbody = document.getElementById("tbody");
        data.students.forEach(s => {
          const last = s.lastSession ? new Date(s.lastSession).toLocaleDateString("en-GB") : "Never";
          const streakClass = s.currentStreak > 0 ? "streak-active" : "streak-dead";

          // Fluency badge
          let fluencyHtml;
          if (!s.avgTurnLength) {
            fluencyHtml = `<span class="fluency-none">—</span>`;
          } else if (s.avgTurnLength >= 8) {
            fluencyHtml = `<span class="fluency-high">${s.avgTurnLength} w/turn</span>`;
          } else if (s.avgTurnLength >= 3) {
            fluencyHtml = `<span class="fluency-mid">${s.avgTurnLength} w/turn</span>`;
          } else {
            fluencyHtml = `<span class="fluency-low">${s.avgTurnLength} w/turn</span>`;
          }

          // Topic
          const topicHtml = s.lastTopic
            ? `<span class="topic" title="${s.lastTopic}">${s.lastTopic.length > 22 ? s.lastTopic.slice(0, 22) + '…' : s.lastTopic}</span>`
            : `<span class="topic-none">—</span>`;

          // Confidence (barge-ins = interruptions = comfort with speaking)
          const bargeHtml = s.bargeInLast > 0
            ? `<span class="barge">${s.bargeInLast} ✦</span>`
            : `<span class="fluency-none">—</span>`;

          tbody.innerHTML += `<tr>
            <td>${s.name}</td>
            <td><span class="level">${s.level}</span></td>
            <td class="${streakClass}">${s.currentStreak}d</td>
            <td>${s.weeklyCount}</td>
            <td>${s.totalSessions}</td>
            <td>${last}</td>
            <td>${topicHtml}</td>
            <td>${fluencyHtml}</td>
            <td>${bargeHtml}</td>
          </tr>`;
        });
        document.getElementById("tbl").hidden = false;
      })
      .catch(() => { document.getElementById("loading").hidden = true; document.getElementById("error").textContent = "Failed to load."; document.getElementById("error").hidden = false; });
  </script>
</body>
</html>
