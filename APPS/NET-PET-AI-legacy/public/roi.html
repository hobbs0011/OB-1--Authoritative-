<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính toán ROI Tiếng Anh B1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a12;
            --purple: #a855f7;
            --gold: #f59e0b;
            --teal: #14b8a6;
            --text: #f8fafc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--void);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .calculator {
            background-color: var(--purple);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
        }
        .calculator select, .calculator input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 5px;
            background-color: var(--void);
            color: var(--text);
            font-size: 1rem;
        }
        .calculator button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            background-color: var(--gold);
            color: var(--void);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .calculator button:hover {
            background-color: var(--teal);
        }
        .result-card {
            background-color: var(--teal);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
        }
        .result-card p {
            font-size: 1.1rem;
            margin: 0.5rem 0;
        }
        .cta-button {
            background-color: var(--purple);
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            color: var(--void);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .cta-button:hover {
            background-color: var(--gold);
        }
        .nav {
            margin-top: 2rem;
        }
        .nav a {
            color: var(--text);
            margin: 0 1rem;
            text-decoration: none;
            font-size: 1rem;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
            .calculator select, .calculator input, .calculator button {
                font-size: 0.9rem;
            }
            .result-card p {
                font-size: 1rem;
            }
            .cta-button, .nav a {
                font-size: 0.9rem;
            }
        }
    </style>
<script src="/assets/net-emoji.js" defer></script>
</head>
<body>
    <div class="container">
        <img src="https://net-art-arsenal.pages.dev/isolated/phoenix-crest-hd.png" alt="Phoenix Crest" style="width: 80px; margin-bottom: 2rem;">
        <h1>Giá trị Tiếng Anh của Bạn?</h1>
        <p>Xem chính xác bạn có thể kiếm thêm bao nhiêu với Tiếng Anh B1 trong ngành nghề của mình</p>
        <div class="calculator">
            <select id="job-category">
                <option value="">Chọn ngành nghề</option>
                <option value="it">IT/Người Thiết Kế Phần Mềm</option>
                <option value="business">Ngân Sách/Kinh Doanh</option>
                <option value="manufacturing">Trưởng Phòng Sản Xuất</option>
                <option value="customer-service">Dịch Vụ Khách Hàng/Bán Hàng</option>
                <option value="teacher">Giáo Viên/Huấn Luyện Viên</option>
            </select>
            <input type="number" id="current-salary" placeholder="Mức lương hiện tại (triệu VND)" min="0">
            <button onclick="calculateROI()">Tính toán</button>
        </div>
        <div class="result-card" id="result-card" style="display: none;">
            <p>Mức lương hiện tại: <span id="current-salary-result"></span> triệu VND</p>
            <p>Mức lương dự kiến: <span id="projected-salary-result"></span> triệu VND</p>
            <p>Tăng lương hàng tháng: <span id="monthly-uplift-result"></span> triệu VND</p>
            <p>Thời gian hoàn vốn đào tạo NET: <span id="payback-period-result"></span> tháng</p>
        </div>
        <button class="cta-button" onclick="window.location.href='/placement'">Thực Hiện Kiểm Tra Đặt Hàng</button>
        <div class="nav">
            <a href="/">Trang Chủ</a>
            <a href="/placement">Kiểm Tra Đặt Hàng</a>
        </div>
    </div>
    <script>
        function calculateROI() {
            const jobCategory = document.getElementById('job-category').value;
            const currentSalary = parseFloat(document.getElementById('current-salary').value);

            if (!jobCategory || isNaN(currentSalary) || currentSalary <= 0) {
                alert('Vui lòng chọn ngành nghề và nhập mức lương hợp lệ.');
                return;
            }

            let upliftPercentage;
            switch (jobCategory) {
                case 'it':
                    upliftPercentage = Math.random() * (60 - 40) + 40;
                    break;
                case 'business':
                    upliftPercentage = Math.random() * (50 - 30) + 30;
                    break;
                case 'manufacturing':
                    upliftPercentage = Math.random() * (40 - 25) + 25;
                    break;
                case 'customer-service':
                    upliftPercentage = Math.random() * (35 - 20) + 20;
                    break;
                case 'teacher':
                    upliftPercentage = Math.random() * (30 - 20) + 20;
                    break;
                default:
                    upliftPercentage = 0;
            }

            const projectedSalary = currentSalary + (currentSalary * upliftPercentage / 100);
            const monthlyUplift = (projectedSalary - currentSalary) / 12;
            const costOfTraining = 1000; // Assuming the cost of NET training is 1 tỷ VND
            const paybackPeriod = Math.ceil(costOfTraining / monthlyUplift);

            document.getElementById('current-salary-result').textContent = currentSalary.toFixed(2);
            document.getElementById('projected-salary-result').textContent = projectedSalary.toFixed(2);
            document.getElementById('monthly-uplift-result').textContent = monthlyUplift.toFixed(2);
            document.getElementById('payback-period-result').textContent = paybackPeriod;

            document.getElementById('result-card').style.display = 'block';
        }
    </script>
</body>
</html>
