<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Void background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer purple ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.4"/>
  <!-- Soul purple circle -->
  <circle cx="256" cy="256" r="170" fill="url(#glow)" filter="url(#shadow)"/>
  <!-- Inner dark overlay for depth -->
  <circle cx="256" cy="256" r="120" fill="rgba(15,15,26,0.6)"/>
  <!-- Imperial gold "O" for Obi -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="180" fill="url(#goldShine)" dy="6">O</text>
  <!-- Subtle gold accent ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
</svg>
