<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="tglow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="#1a0f00" stroke="url(#tg)" stroke-width="3" filter="url(#tglow)"/>
  <!-- Left ear -->
  <path d="M14 16 l-4 -10 l10 4 z" fill="url(#tg)" opacity="0.9"/>
  <!-- Right ear -->
  <path d="M50 16 l4 -10 l-10 4 z" fill="url(#tg)" opacity="0.9"/>
  <!-- Face outline -->
  <path d="M32 14 Q22 14 18 22 Q14 30 16 38 Q18 44 22 47 Q26 50 32 51 Q38 50 42 47 Q46 44 48 38 Q50 30 46 22 Q42 14 32 14Z" fill="#2a1500" stroke="url(#tg)" stroke-width="1.5"/>
  <!-- Forehead stripe -->
  <path d="M30 16 L34 16 L33 22 L31 22 Z" fill="url(#tg)" opacity="0.8"/>
  <!-- Left eye -->
  <ellipse cx="25" cy="29" rx="3.5" ry="4" fill="url(#tg)" transform="rotate(-10 25 29)"/>
  <ellipse cx="25" cy="29" rx="1.5" ry="2.5" fill="#1a0f00" transform="rotate(-10 25 29)"/>
  <!-- Right eye -->
  <ellipse cx="39" cy="29" rx="3.5" ry="4" fill="url(#tg)" transform="rotate(10 39 29)"/>
  <ellipse cx="39" cy="29" rx="1.5" ry="2.5" fill="#1a0f00" transform="rotate(10 39 29)"/>
  <!-- Nose bridge -->
  <path d="M30 35 L34 35 L32 39 Z" fill="#f59e0b" opacity="0.6"/>
  <!-- Nose tip -->
  <circle cx="32" cy="40" r="2" fill="#f59e0b"/>
  <!-- Chin -->
  <path d="M28 44 Q32 47 36 44" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <!-- Whiskers left -->
  <line x1="14" y1="36" x2="22" y2="37" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="39" x2="22" y2="39" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="42" x2="22" y2="41" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <!-- Whiskers right -->
  <line x1="50" y1="36" x2="42" y2="37" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <line x1="50" y1="39" x2="42" y2="39" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <line x1="50" y1="42" x2="42" y2="41" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
</svg>
