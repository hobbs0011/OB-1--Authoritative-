<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>Offline | Natural English Training</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 400px; }
    .emoji { font-size: 4rem; margin-bottom: 20px; display: block; }
    h1 { font-size: 1.6rem; margin-bottom: 12px; color: #f8f5ff; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    .vi { font-size: 0.9rem; color: #64748b; }
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #a855f7;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="emoji">🐭</span>
    <h1>You are offline.</h1>
    <p>Obi needs an internet connection to talk. Connect and come back — your streak is waiting.</p>
    <p class="vi">Obi cần kết nối internet. Hãy kết nối lại — streak của bạn đang chờ.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
