<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NET App V0 — Natural English Training</title>
  <meta name="description" content="Learn English naturally: Listen, Mimic, Speak, Confidence. Break free from grammar prison." />
  
  <style>
    /* ═══════════════════════════════════════════════════════════════
       NET APP V0 — GOSPEL 444 COMPLIANT STYLES
       © Michael Hobbs — Executor
       Canon Lock: NET Blueprint DNA V0
       
       SECURITY: P0 Compliant (No inline events, No unsafe HTML)
       AESTHETICS: Gospel 444 (Purple + Gold + Dark, NO BLUE except Noise)
       ARCHITECTURE: Phoenix Engine V30.35 principles
    ═══════════════════════════════════════════════════════════════ */
    
    :root {
      /* GOSPEL 444 COLOR PALETTE (IMMUTABLE) */
      --color-purple: #a855f7;
      --color-gold: #f59e0b;
      --color-dark: #0f0f1a;
      --color-text: #e5e7eb;
      --color-text-dim: rgba(148, 163, 184, 0.85);
      
      /* Glassmorphism */
      --glass-bg: rgba(26, 26, 38, 0.85);
      --glass-border: rgba(168, 85, 247, 0.4);
      --glass-blur: 12px; /* MINIMUM per Gospel 444 */
      
      /* Effects */
      --glow-purple: 0 0 20px rgba(168, 85, 247, 0.6);
      --glow-gold: 0 0 15px rgba(245, 158, 11, 0.5);
      --glow-combined: 0 0 25px rgba(168, 85, 247, 0.5), 0 0 15px rgba(245, 158, 11, 0.4);
      
      /* Transitions */
      --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      background: radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
                  radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 50%),
                  var(--color-dark);
      color: var(--color-text);
      overflow-x: hidden;
    }
    
    /* Animated Background Blobs (Gospel 444 Depth) */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      pointer-events: none;
      mix-blend-mode: screen;
      animation: blob-float 18s ease-in-out infinite;
      z-index: 0;
    }
    
    .blob--purple {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.8), transparent 70%);
      top: -50px;
      left: -50px;
    }
    
    .blob--gold {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.7), transparent 70%);
      bottom: -80px;
      right: -80px;
      animation-delay: 6s;
    }
    
    @keyframes blob-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }
    
    /* App Container */
    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    .header {
      padding: 1.5rem 2rem;
      backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      background: linear-gradient(135deg, rgba(15, 15, 26, 0.95), rgba(15, 15, 26, 0.85));
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glow-purple);
    }
    
    .header__inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--color-text);
    }
    
    .logo__orb {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-purple) 0%, transparent 70%);
      box-shadow: var(--glow-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
    
    .logo__text {
      display: flex;
      flex-direction: column;
    }
    
    .logo__title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    
    .logo__subtitle {
      font-size: 0.75rem;
      color: var(--color-text-dim);
    }
    
    .nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .nav__btn {
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 247, 0.4);
      background: rgba(15, 15, 26, 0.8);
      color: var(--color-text);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-smooth);
      white-space: nowrap;
    }
    
    .nav__btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow-purple);
      border-color: var(--color-purple);
    }
    
    .nav__btn--active {
      background: radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.4), transparent 80%);
      border-color: var(--color-purple);
      box-shadow: var(--glow-combined);
      font-weight: 600;
    }
    
    /* Main Content */
    .main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }
    
    .view {
      display: none;
      animation: view-fade-in 0.4s ease-out;
    }
    
    .view--active {
      display: block;
    }
    
    @keyframes view-fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
    }
    
    .page-header__eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--color-gold);
      margin-bottom: 0.5rem;
    }
    
    .page-header__title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .page-header__title span {
      color: var(--color-purple);
    }
    
    .page-header__subtitle {
      font-size: 0.95rem;
      color: var(--color-text-dim);
      max-width: 600px;
    }
    
    /* Glass Card (Gospel 444 Glassmorphism) */
    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 1.5rem;
      padding: 1.5rem;
      backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3), var(--glow-purple);
      margin-bottom: 1.5rem;
    }
    
    .card__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    
    .card__title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    
    .card__badge {
      font-size: 0.7rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(245, 158, 11, 0.6);
      background: rgba(245, 158, 11, 0.15);
      color: var(--color-gold);
      white-space: nowrap;
    }
    
    .card__body {
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(229, 231, 235, 0.9);
    }
    
    .card__body p {
      margin-bottom: 0.75rem;
    }
    
    .card__body p:last-child {
      margin-bottom: 0;
    }
    
    /* Grid Layouts */
    .grid {
      display: grid;
      gap: 1.5rem;
    }
    
    .grid--2 {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    
    /* Tag Row */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.8);
    }
    
    .tag--purple {
      border-color: rgba(168, 85, 247, 0.7);
      color: #c4b5fd;
    }
    
    .tag--gold {
      border-color: rgba(245, 158, 11, 0.7);
      color: #fcd34d;
    }
    
    /* Buddy List */
    .buddy-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    
    .buddy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 1rem;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }
    
    .buddy:hover {
      background: radial-gradient(circle at 10% 50%, rgba(168, 85, 247, 0.2), transparent 70%);
      border-color: var(--color-purple);
      box-shadow: var(--glow-purple);
      transform: translateX(4px);
    }
    
    .buddy--selected {
      background: radial-gradient(circle at 10% 50%, rgba(168, 85, 247, 0.3), transparent 70%);
      border-color: var(--color-purple);
      box-shadow: var(--glow-combined);
    }
    
    .buddy__main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .buddy__avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.5), transparent 70%);
      border: 2px solid rgba(168, 85, 247, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    
    .buddy__info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    
    .buddy__name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    .buddy__meta {
      font-size: 0.8rem;
      color: var(--color-text-dim);
    }
    
    .buddy__stat {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: var(--color-gold);
    }
    
    /* Form Elements */
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    
    .form-field__label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-dim);
    }
    
    .form-field__input,
    .form-field__select,
    .form-field__textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 0.75rem;
      color: var(--color-text);
      font-size: 0.9rem;
      font-family: inherit;
      transition: all var(--transition-smooth);
    }
    
    .form-field__input:focus,
    .form-field__select:focus,
    .form-field__textarea:focus {
      outline: none;
      border-color: var(--color-purple);
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
      background: rgba(15, 23, 42, 1);
    }
    
    .form-field__textarea {
      min-height: 120px;
      resize: vertical;
      font-family: inherit;
    }
    
    /* Buttons */
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-smooth);
      border: 1px solid transparent;
      white-space: nowrap;
    }
    
    .btn--secondary {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(148, 163, 184, 0.6);
      color: var(--color-text);
    }
    
    .btn--secondary:hover {
      background: rgba(15, 23, 42, 1);
      border-color: rgba(148, 163, 184, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(148, 163, 184, 0.4);
    }
    
    .btn--primary {
      background: linear-gradient(135deg, var(--color-purple) 0%, var(--color-gold) 100%);
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--color-dark);
      box-shadow: var(--glow-combined);
    }
    
    .btn--primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.8), 0 0 20px rgba(245, 158, 11, 0.6);
    }
    
    /* Status Message */
    .status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 0.75rem;
      font-size: 0.85rem;
      color: var(--color-text-dim);
    }
    
    .status span {
      color: var(--color-gold);
      font-weight: 600;
    }
    
    /* Metrics */
    .metrics {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    
    .metric {
      padding: 0.5rem 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 999px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .metric__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-gold);
      box-shadow: var(--glow-gold);
    }
    
    /* Footer */
    .footer {
      padding: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-text-dim);
      background: rgba(15, 15, 26, 0.6);
      backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border);
    }
    
    .footer__executor {
      color: var(--color-purple);
      font-weight: 600;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .header__inner {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .nav {
        width: 100%;
      }
      
      .nav__btn {
        flex: 1;
        text-align: center;
      }
      
      .main {
        padding: 1.5rem 1rem;
      }
      
      .page-header__title {
        font-size: 1.5rem;
      }
      
      .grid--2 {
        grid-template-columns: 1fr;
      }
    }
    
    /* Utility Classes */
    .hidden {
      display: none !important;
    }
    
    .text-center {
      text-align: center;
    }
    
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <!-- Animated Background Blobs -->
  <div class="blob blob--purple"></div>
  <div class="blob blob--gold"></div>
  
  <!-- App Container -->
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header__inner">
        <a href="#" class="logo">
          <div class="logo__orb">NET</div>
          <div class="logo__text">
            <div class="logo__title">Natural English</div>
            <div class="logo__subtitle">Training • Saigon</div>
          </div>
        </a>
        
        <nav class="nav" id="nav">
          <!-- Navigation buttons generated by JS -->
        </nav>
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="main" id="main">
      <!-- Views will be generated by JS -->
    </main>
    
    <!-- Footer -->
    <footer class="footer">
      <div>NET App V0 • Buddy System First</div>
      <div class="mt-1">
        Executor: <span class="footer__executor">Michael Hobbs</span> | 
        Canon: Blueprint DNA V0 | 
        Gospel 444 Compliant
      </div>
    </footer>
  </div>
  
  <script>
    // ═══════════════════════════════════════════════════════════════
    // NET APP V0 — VANILLA JAVASCRIPT APPLICATION
    // © Michael Hobbs — Executor
    // Security: P0/P1 Compliant (No inline events, Input sanitization)
    // Architecture: Phoenix Engine V30.35 principles
    // ═══════════════════════════════════════════════════════════════
    
    'use strict';
    
    // ──────────────────────────────────────────────────────────────
    // SECURITY: Input Sanitization (P1 Requirement)
    // ──────────────────────────────────────────────────────────────
    function sanitizeInput(input) {
      const temp = document.createElement('div');
      temp.textContent = input || '';
      return temp.textContent;
    }
    
    // ──────────────────────────────────────────────────────────────
    // STATE: Application State (Single Source of Truth)
    // ──────────────────────────────────────────────────────────────
    const APP_STATE = {
      version: 'V0',
      activeView: 'dashboard',
      
      // Student profiles (real students from canon)
      students: [
        {
          id: 'nhan',
          name: 'Nhan',
          level: 'B1-',
          archetype: 'Low Confidence / Low Volume',
          focus: 'Confidence & Volume',
          challenges: 'Echo Chamber Arc',
          sessionsThisWeek: 1
        },
        {
          id: 'kiet',
          name: 'Kiet',
          level: 'C1',
          archetype: 'Advanced / High Skill',
          focus: 'Structure & Deep Topics',
          challenges: 'Speed Demon Arc',
          sessionsThisWeek: 0
        },
        {
          id: 'quang',
          name: 'Quang',
          level: 'B1',
          archetype: 'University / Presentations',
          focus: 'Business & Presentations',
          challenges: 'Presentation Panic Arc',
          sessionsThisWeek: 0
        }
      ],
      
      selectedStudentId: null,
      
      // Buddy session builder
      session: {
        goal: 'confidence',
        length: 30,
        topic: 'weekend',
        notes: ''
      },
      
      lockedSession: null,
      
      // Metrics
      metrics: {
        streak: 3,
        minutesToday: 30,
        nextBuddySession: 'Tonight 8:30 PM'
      }
    };
    
    // ──────────────────────────────────────────────────────────────
    // PERSISTENCE: LocalStorage with Hash Verification (P1)
    // ──────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'net_app_state_v0';
    
    async function hashState(data) {
      const json = JSON.stringify(data);
      const encoder = new TextEncoder();
      const dataBuffer = encoder.encode(json);
      
      if (!crypto || !crypto.subtle) {
        console.warn('[Chatty Prime] SubtleCrypto unavailable, hash skipped');
        return 'NO_HASH';
      }
      
      const hashBuffer = await crypto.subtle.digest('SHA-256', dataBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    async function saveState() {
      try {
        const stateData = {
          data: APP_STATE,
          meta: {
            version: APP_STATE.version,
            timestamp: new Date().toISOString()
          }
        };
        
        const hash = await hashState(stateData.data);
        stateData.meta.hash = hash;
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stateData));
        console.log('[Sync_Core] State saved with hash:', hash.substring(0, 16) + '...');
      } catch (error) {
        console.error('[Chatty Prime] Failed to save state:', error);
      }
    }
    
    async function loadState() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return;
        
        const parsed = JSON.parse(stored);
        
        // Verify hash
        if (parsed.meta && parsed.meta.hash) {
          const expectedHash = await hashState(parsed.data);
          if (expectedHash !== parsed.meta.hash && expectedHash !== 'NO_HASH') {
            console.warn('[Chatty Prime] State hash mismatch, possible tampering');
            return;
          }
        }
        
        // Merge saved state
        Object.assign(APP_STATE, parsed.data);
        console.log('[Sync_Core] State loaded successfully');
      } catch (error) {
        console.warn('[Sync_Core] Corrupted state, starting fresh:', error);
      }
    }
    
    // ──────────────────────────────────────────────────────────────
    // VIEWS: View Definitions
    // ──────────────────────────────────────────────────────────────
    const VIEWS = {
      dashboard: {
        title: 'Welcome back, <span>Student</span>',
        eyebrow: 'NET • Buddy-First Build',
        subtitle: '1 hour a day, confidence for life. Buddy System is the core of V0.',
        render: renderDashboardView
      },
      buddies: {
        title: 'Buddy System',
        eyebrow: 'NET • Confidence Engine',
        subtitle: 'You don\'t beat fear alone. You beat it laughing with a partner.',
        render: renderBuddiesView
      },
      lessons: {
        title: 'Lesson Academies',
        eyebrow: 'NET • Four Pillars',
        subtitle: 'Sarcasm, Careers, Context, Pronunciation — all waiting for StoryFlow.',
        render: renderLessonsView
      },
      community: {
        title: 'Community Events',
        eyebrow: 'NET • Real World Practice',
        subtitle: 'Monthly networking nights in Saigon. English has to leave the classroom.',
        render: renderCommunityView
      },
      settings: {
        title: 'Profile & Settings',
        eyebrow: 'NET • Personalization',
        subtitle: 'Tune your experience. The right content at the right time.',
        render: renderSettingsView
      }
    };
    
    // ──────────────────────────────────────────────────────────────
    // RENDER: Navigation
    // ──────────────────────────────────────────────────────────────
    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = '';
      
      Object.keys(VIEWS).forEach(viewKey => {
        const btn = document.createElement('button');
        btn.className = 'nav__btn';
        btn.textContent = viewKey.charAt(0).toUpperCase() + viewKey.slice(1);
        btn.dataset.view = viewKey;
        
        if (APP_STATE.activeView === viewKey) {
          btn.classList.add('nav__btn--active');
        }
        
        // P0 COMPLIANT: Event delegation, no inline events
        btn.addEventListener('click', () => {
          APP_STATE.activeView = viewKey;
          renderApp();
          saveState();
        });
        
        nav.appendChild(btn);
      });
    }
    
    // ──────────────────────────────────────────────────────────────

    // ──────────────────────────────────────────────────────────────
    // RENDER: Buddy List
    // ──────────────────────────────────────────────────────────────
    function renderBuddyList() {
      const container = document.getElementById('buddy-list');
      if (!container) return;
      
      container.innerHTML = '';
      
      APP_STATE.students.forEach(student => {
        const div = document.createElement('div');
        div.className = 'buddy';
        if (APP_STATE.selectedStudentId === student.id) {
          div.classList.add('buddy--selected');
        }
        
        div.innerHTML = `
          <div class="buddy__main">
            <div class="buddy__avatar">${student.name.charAt(0)}</div>
            <div class="buddy__info">
              <div class="buddy__name">${sanitizeInput(student.name)}</div>
              <div class="buddy__meta">${sanitizeInput(student.level)} • ${sanitizeInput(student.focus)}</div>
            </div>
          </div>
          <div class="buddy__stat">${student.sessionsThisWeek}x this week</div>
        `;
        
        // P0 COMPLIANT: Event delegation
        div.addEventListener('click', () => {
          APP_STATE.selectedStudentId = student.id;
          renderBuddyList();
          saveState();
        });
        
        container.appendChild(div);
      });
    }
    
    // ──────────────────────────────────────────────────────────────
    // LOGIC: Auto-fill Session Template
    // ──────────────────────────────────────────────────────────────
    function autoFillSession() {
      const goal = document.getElementById('session-goal').value;
      const length = parseInt(document.getElementById('session-length').value);
      const topic = document.getElementById('session-topic').value;
      
      let template = '';
      const warmup = '5 minutes: warm-up small talk about your day.\n';
      const review = '5 minutes: quick review — each person shares 1 thing they did well and 1 thing to improve.\n';
      const mainTime = length - 10;
      
      if (goal === 'confidence') {
        template = warmup + mainTime + ' minutes: take turns telling a story. Listener asks follow-up questions. Focus on VOLUME.\n' + review;
      } else if (goal === 'small-talk') {
        template = warmup + mainTime + ' minutes: imagine you just met at a networking event. Practice natural questions.\n' + review;
      } else if (goal === 'business') {
        template = warmup + mainTime + ' minutes: role-play a short meeting about work tasks.\n' + review;
      } else if (goal === 'pronunciation') {
        template = warmup + mainTime + ' minutes: choose 5–8 sentences and drill volume, rhythm, key sounds.\n' + review;
      } else if (goal === 'storytelling') {
        template = warmup + mainTime + ' minutes: tell one strong story each. Past tense, feelings, details.\n' + review;
      }
      
      // Topic guidance
      const topicGuides = {
        weekend: '\nTopic: what you did last weekend, funny moments, anything that went wrong.',
        work: '\nTopic: this week at work — wins, problems, one conversation with your boss.',
        dreams: '\nTopic: your dream job, country, or project in the next 5–10 years.',
        travel: '\nTopic: best trip so far, where you want to go next, culture shocks.',
        movies: '\nTopic: favorite series or movie, why you like it, characters you relate to.'
      };
      
      template += topicGuides[topic] || '';
      
      document.getElementById('session-notes').value = template;
      document.getElementById('session-status').textContent = 'Draft generated. Edit anything you want, then lock this session.';
    }
    
    // ──────────────────────────────────────────────────────────────
    // LOGIC: Lock Session
    // ──────────────────────────────────────────────────────────────
    function lockSession() {
      if (!APP_STATE.selectedStudentId) {
        document.getElementById('session-status').textContent = 'Choose a buddy first. This session is for two people, not a textbook.';
        return;
      }
      
      const notes = document.getElementById('session-notes').value.trim();
      if (!notes) {
        document.getElementById('session-status').textContent = 'Write or auto-fill a simple plan. Keep it small and realistic.';
        return;
      }
      
      const buddy = APP_STATE.students.find(s => s.id === APP_STATE.selectedStudentId);
      const goal = document.getElementById('session-goal').value;
      const length = parseInt(document.getElementById('session-length').value);
      const topic = document.getElementById('session-topic').value;
      
      // P1 SECURITY: Sanitize user input
      APP_STATE.lockedSession = {
        buddyId: buddy.id,
        goal: sanitizeInput(goal),
        length: length,
        topic: sanitizeInput(topic),
        notes: sanitizeInput(notes)
      };
      
      const statusEl = document.getElementById('session-status');
      statusEl.innerHTML = `Session locked with <span>${buddy.name}</span> for <span>${length} minutes</span>. The only job now: show up.`;
      
      saveState();
    }
    
    // ──────────────────────────────────────────────────────────────
    // RENDER: Main Application
    // ──────────────────────────────────────────────────────────────
    function renderApp() {
      renderNav();
      
      const main = document.getElementById('main');
      const view = VIEWS[APP_STATE.activeView];
      
      if (!view) {
        console.error('[Gemini] Invalid view:', APP_STATE.activeView);
        return;
      }
      
      main.innerHTML = `
        <div class="view view--active">
          ${renderPageHeader(view)}
          ${view.render()}
        </div>
      `;
      
      // Attach event listeners for buddies view
      if (APP_STATE.activeView === 'buddies') {
        renderBuddyList();
        
        const autoFillBtn = document.getElementById('btn-auto-fill');
        const lockBtn = document.getElementById('btn-lock-session');
        
        if (autoFillBtn) {
          autoFillBtn.addEventListener('click', autoFillSession);
        }
        
        if (lockBtn) {
          lockBtn.addEventListener('click', lockSession);
        }
      }
    }
    
    // ──────────────────────────────────────────────────────────────
    // INITIALIZATION
    // ──────────────────────────────────────────────────────────────
    async function init() {
      console.log('[Sync_Core] Initializing NET App V0...');
      
      await loadState();
      renderApp();
      
      console.log('[Sync_Core] NET App V0 ready. Gospel 444 compliant. Canon locked.');
    }
    
    // Start application when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
