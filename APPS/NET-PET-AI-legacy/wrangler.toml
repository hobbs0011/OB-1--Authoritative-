name = "net-pet-ai"
main = "src/router.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]

# Shared D1 — soul-archive (soul-logger's database for direct event logging)
[[d1_databases]]
binding = "SOUL_DB"
database_name = "soul-archive"
database_id = "c69a11bc-064b-478f-9b1f-e9b8e2431fb8"

# DNS route - requires naturalenglishtraining.com zone to be on this CF account first
# [[routes]]
# pattern = "www.naturalenglishtraining.com/*"
# zone_name = "naturalenglishtraining.com"

# KV namespace for distributed rate limiting (survives worker restarts)
[[kv_namespaces]]
binding = "RATELIMIT"
id = "b27d144f71c44b00a4c87360841e525f"

# KV namespace for session hints (Chrome extension → chat.js YouTube personalization)
[[kv_namespaces]]
binding = "NET_PET_KV"
id = "0583d1a59bb24e598c4645396647eb94"

# KV namespace for Student Memory Pipeline (world_model, breakthroughs, struggles)
[[kv_namespaces]]
binding = "STUDENT_MEMORY"
id = "807ea30d96844c0dbf561d0ae3a3c1f3"

[assets]
directory = "./public"
binding = "ASSETS"

# [[durable_objects.bindings]]
# name = "SESSIONS"
# class_name = "SessionDO"       # removed — class stripped, export gap closed

# [[durable_objects.bindings]]
# name = "PROFILES"
# class_name = "ProfileDO"       # removed — class stripped, export gap closed

[[durable_objects.bindings]]
name = "PETS"
class_name = "PetDO"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[durable_objects.bindings]]
name = "MEMORY"
class_name = "MemoryDO"

[[durable_objects.bindings]]
name = "COMMANDS"
class_name = "CommandDO"

