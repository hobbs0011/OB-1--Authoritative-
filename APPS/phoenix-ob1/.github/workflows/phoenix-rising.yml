name: "🔥 PHOENIX RISING PROTOCOL — 20-Stage Chaos Magic"

# =============================================================================
# PHOENIX RISING PROTOCOL — Phoenix OB-1 v140-HANDOFF-FINAL
# 20-stage chaos-gated deploy pipeline
# The full ritual. Every stage must pass or the Phoenix does not rise.
# =============================================================================
# Full source: mrmichaelhobbs1234-lang/phoenix-ob1/.github/workflows/phoenix-rising.yml
# Migrated to Ultimate repo 2026-03-24
#
# Stages: Ignition → Repo Truth → Entrypoint Truth → Migration Guardian →
#         KV Truth → Body Guard → Chaos Scan → Validator Truth → Dep Lock →
#         Dry Run → Hash Seal → Pre-Deploy Probe → Deploy → Propagation →
#         Smoke Health → Smoke Ledger → Smoke Chat → Chaos Probe →
#         Benchmark Record → The Seal
#
# PHOENIX_RISEN emitted only when ALL 20 stages pass.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'validators/**'
      - 'wrangler.toml'
      - '.trigger'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy past warnings'
        required: false
        default: 'false'
      chaos_level:
        description: 'Chaos level: low | medium | high | SUPER_SAIYAN'
        required: false
        default: 'SUPER_SAIYAN'
      ritual_name:
        description: 'Name this reincarnation'
        required: false
        default: 'UNNAMED_RITUAL'

concurrency:
  group: deploy-phoenix-ob1
  cancel-in-progress: true

env:
  WORKER_URL: https://phoenix-ob1-system.mrmichaelhobbs1234.workers.dev
  WORKER_NAME: phoenix-ob1-system
  NODE_VERSION: '20'

jobs:
  stage-01-ignition:
    name: "🔥 S01 · Ignition"
    runs-on: ubuntu-latest
    outputs:
      ritual_id: $ steps.ritual.outputs.ritual_id 
      timestamp: $ steps.ritual.outputs.timestamp 
    steps:
      - uses: actions/checkout@v4
      - name: 🔥 Announce ritual
        id: ritual
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RID="PHOENIX-$(date -u +%Y%m%d%H%M%S)-$(echo $ github.sha  | cut -c1-7)"
          echo "ritual_id=$RID" >> $GITHUB_OUTPUT
          echo "timestamp=$TS" >> $GITHUB_OUTPUT

  stage-02-repo-truth:
    name: "🗂️ S02 · Repo Truth Audit"
    runs-on: ubuntu-latest
    needs: stage-01-ignition
    steps:
      - uses: actions/checkout@v4
      - name: 🗂️ Verify repo structure
        run: |
          test -f src/reincarnate.js
          test -f validators/student-profile.js
          test -f wrangler.toml
          test -f package.json
          test -d .github/workflows
          test -d docs

  stage-03-entrypoint-truth:
    name: "🎯 S03 · Entrypoint Truth"
    runs-on: ubuntu-latest
    needs: stage-02-repo-truth
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'main = "src/reincarnate.js"' wrangler.toml

  stage-04-migration-guardian:
    name: "🧱 S04 · Migration Tag Guardian"
    runs-on: ubuntu-latest
    needs: stage-03-entrypoint-truth
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q 'v1-genesis' wrangler.toml
          grep -q 'v2-student-profiles' wrangler.toml
          grep -q 'v3-ledger-physics' wrangler.toml
          grep -q 'v4-rate-limiter' wrangler.toml
          grep -q 'v5-memory-do' wrangler.toml

  stage-05-kv-truth:
    name: "🗄️ S05 · KV Truth"
    runs-on: ubuntu-latest
    needs: stage-04-migration-guardian
    steps:
      - uses: actions/checkout@v4
      - run: grep -A2 'binding = "SOUL_DNA"' wrangler.toml

  stage-06-body-guard:
    name: "🛡️ S06 · Code Body Guard"
    runs-on: ubuntu-latest
    needs: stage-05-kv-truth
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q 'safeJsonBytes' src/reincarnate.js
          grep -q 'CHAOS_EXEMPT_PATHS' src/reincarnate.js
          grep -q 'REINCARNATION_SEED' src/reincarnate.js

  stage-07-chaos-scan:
    name: "🌩️ S07 · Chaos Hooks Scan"
    runs-on: ubuntu-latest
    needs: stage-06-body-guard
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'injectChaos\|VOIDPHEROMONE' src/reincarnate.js

  stage-08-validator-truth:
    name: "📋 S08 · Validator Schema Truth"
    runs-on: ubuntu-latest
    needs: stage-07-chaos-scan
    steps:
      - uses: actions/checkout@v4
      - run: test -f validators/student-profile.js

  stage-09-dep-lock:
    name: "📦 S09 · Dependency Lock"
    runs-on: ubuntu-latest
    needs: stage-08-validator-truth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
      - run: npm ci --prefer-offline 2>/dev/null || npm install

  stage-10-dry-run:
    name: "🧪 S10 · Dry Run Bundle"
    runs-on: ubuntu-latest
    needs: stage-09-dep-lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
      - run: npm ci --prefer-offline 2>/dev/null || npm install
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
          CLOUDFLARE_ACCOUNT_ID: $ secrets.CLOUDFLARE_ACCOUNT_ID 

  stage-11-hash-seal:
    name: "🔏 S11 · Entrypoint Hash Seal"
    runs-on: ubuntu-latest
    needs: stage-10-dry-run
    outputs:
      entrypoint_hash: $ steps.hash.outputs.hash 
    steps:
      - uses: actions/checkout@v4
      - id: hash
        run: |
          HASH=$(sha256sum src/reincarnate.js | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

  stage-12-pre-deploy-probe:
    name: "🩺 S12 · Pre-Deploy Health Probe"
    runs-on: ubuntu-latest
    needs: stage-11-hash-seal
    continue-on-error: true
    steps:
      - run: curl -sf --max-time 10 $ env.WORKER_URL /health || echo 'UNREACHABLE'

  stage-13-deploy:
    name: "🚀 S13 · Deploy to Cloudflare"
    runs-on: ubuntu-latest
    needs: [stage-11-hash-seal, stage-12-pre-deploy-probe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
      - run: npm ci --prefer-offline 2>/dev/null || npm install
      - name: 🚀 Deploy
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
          CLOUDFLARE_ACCOUNT_ID: $ secrets.CLOUDFLARE_ACCOUNT_ID 
        run: npx wrangler deploy --config ./wrangler.toml ./src/reincarnate.js

  stage-14-propagation:
    name: "⏳ S14 · Propagation Wait"
    runs-on: ubuntu-latest
    needs: stage-13-deploy
    steps:
      - run: sleep 15

  stage-15-smoke-health:
    name: "💨 S15 · Smoke: Health"
    runs-on: ubuntu-latest
    needs: stage-14-propagation
    steps:
      - run: curl -sf --max-time 15 $ env.WORKER_URL /health | grep '"ok":true'

  stage-16-smoke-ledger:
    name: "📚 S16 · Smoke: Ledger"
    runs-on: ubuntu-latest
    needs: stage-14-propagation
    steps:
      - run: curl -sf --max-time 15 $ env.WORKER_URL /evidence
      - run: curl -sf --max-time 15 $ env.WORKER_URL /ledgerverify
      - run: curl -sf --max-time 15 $ env.WORKER_URL /reincarnate

  stage-17-smoke-chat:
    name: "💬 S17 · Smoke: Chat"
    runs-on: ubuntu-latest
    needs: stage-14-propagation
    steps:
      - run: |
          curl -sf --max-time 15 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"message":"ping","sessionId":"smoke"}' \
            $ env.WORKER_URL /chat || true
      - run: |
          STATUS=$(curl -so /dev/null -w '%{http_code}' --max-time 15 \
            -X OPTIONS -H 'Access-Control-Request-Method: POST' \
            -H 'Origin: https://obiana.ai' $ env.WORKER_URL /chat)
          [ "$STATUS" = "200" ] || exit 1

  stage-18-chaos-probe:
    name: "🌪️ S18 · Chaos Probe"
    runs-on: ubuntu-latest
    needs: [stage-15-smoke-health, stage-16-smoke-ledger, stage-17-smoke-chat]
    continue-on-error: true
    steps:
      - run: curl -sf --max-time 15 $ env.WORKER_URL /health

  stage-19-benchmark-record:
    name: "🏁 S19 · Benchmark Record"
    runs-on: ubuntu-latest
    needs: stage-18-chaos-probe
    continue-on-error: true
    steps:
      - run: echo "Deploy event recorded"

  stage-20-seal:
    name: "🔒 S20 · The Seal"
    runs-on: ubuntu-latest
    needs:
      - stage-02-repo-truth
      - stage-03-entrypoint-truth
      - stage-04-migration-guardian
      - stage-06-body-guard
      - stage-13-deploy
      - stage-15-smoke-health
      - stage-16-smoke-ledger
      - stage-17-smoke-chat
    if: always()
    steps:
      - run: echo "PHOENIX RISING PROTOCOL — SEAL — $ github.sha "
