name: "⚡ CODEX — Chaos Magic Accelerated Deploy"

# =============================================================================
# CODEX PIPELINE — Phoenix OB-1 v140-HANDOFF-FINAL
# Full-stack chaos-gated deploy with parallel verification
# Sequence: preflight → chaos-gate → deploy → smoke → benchmark-ping → seal
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'validators/**'
      - 'wrangler.toml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if preflight warns'
        required: false
        default: 'false'
      chaos_level:
        description: 'Chaos level: low | medium | high'
        required: false
        default: 'medium'

concurrency:
  group: deploy-phoenix-ob1
  cancel-in-progress: true

env:
  WORKER_URL: https://phoenix-ob1-system.mrmichaelhobbs1234.workers.dev
  WORKER_NAME: phoenix-ob1-system
  NODE_VERSION: '20'

jobs:
  preflight:
    name: "🔬 Preflight Audit"
    runs-on: ubuntu-latest
    outputs:
      safe_to_deploy: $ steps.audit.outputs.safe_to_deploy 
      entrypoint_hash: $ steps.audit.outputs.entrypoint_hash 
    steps:
      - uses: actions/checkout@v4
      - name: "🔍 Entrypoint truth check"
        run: |
          grep -q 'main = "src/reincarnate.js"' wrangler.toml || { echo "FAIL: entrypoint drift"; exit 1; }
      - name: "🛡️ Body guard check"
        run: grep -q 'safeJsonBytes' src/reincarnate.js || { echo "FATAL: safeJsonBytes guard missing"; exit 1; }
      - name: "🧱 DO migration tags check"
        run: |
          grep -q 'v1-genesis' wrangler.toml
          grep -q 'v2-student-profiles' wrangler.toml
          grep -q 'v3-ledger-physics' wrangler.toml
          grep -q 'v4-rate-limiter' wrangler.toml
          grep -q 'v5-memory-do' wrangler.toml
      - name: "📊 Emit preflight outputs"
        id: audit
        run: |
          HASH=$(sha256sum src/reincarnate.js | cut -d' ' -f1)
          echo "safe_to_deploy=true" >> $GITHUB_OUTPUT
          echo "entrypoint_hash=$HASH" >> $GITHUB_OUTPUT

  chaos-gate:
    name: "🌩️ Chaos Gate"
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
      - run: npm ci --prefer-offline 2>/dev/null || npm install
      - name: "⚡ Wrangler dry-run validation"
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
          CLOUDFLARE_ACCOUNT_ID: $ secrets.CLOUDFLARE_ACCOUNT_ID 

  deploy:
    name: "🚀 Deploy to Cloudflare"
    runs-on: ubuntu-latest
    needs: [preflight, chaos-gate]
    if: needs.preflight.outputs.safe_to_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
      - run: npm ci --prefer-offline 2>/dev/null || npm install
      - name: "🚀 Wrangler deploy"
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
          CLOUDFLARE_ACCOUNT_ID: $ secrets.CLOUDFLARE_ACCOUNT_ID 
        run: npx wrangler deploy --config ./wrangler.toml ./src/reincarnate.js 2>&1 | tee /tmp/deploy.out

  smoke:
    name: "💨 Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: "⏳ Wait for propagation"
        run: sleep 10
      - name: "💯 /health check"
        run: curl -sf --max-time 15 $ env.WORKER_URL /health | grep '"ok":true'
      - name: "🔍 /evidence check"
        run: curl -sf --max-time 15 $ env.WORKER_URL /evidence | grep 'version'
      - name: "📊 /ledgerverify check"
        run: curl -sf --max-time 15 $ env.WORKER_URL /ledgerverify
      - name: "🔁 /reincarnate check"
        run: curl -sf --max-time 15 $ env.WORKER_URL /reincarnate | grep 'sovereign'

  benchmark-ping:
    name: "🏁 Benchmark Ping"
    runs-on: ubuntu-latest
    needs: smoke
    continue-on-error: true
    steps:
      - name: "📊 Fetch benchmark state"
        run: curl -sf --max-time 15 $ env.WORKER_URL /health

  seal:
    name: "🔒 Seal"
    runs-on: ubuntu-latest
    needs: [preflight, deploy, smoke]
    if: always()
    steps:
      - name: "📊 Pipeline summary"
        run: echo "CODEX PIPELINE SEAL — commit $ github.sha "
