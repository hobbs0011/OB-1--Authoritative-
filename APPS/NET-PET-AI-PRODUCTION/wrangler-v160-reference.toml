name = "net-pet-ai"
main = "src/index.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]

# NOTE: Migrations for existing Durable Objects.
# These classes are already initialized in production (RUN311+).
# Migration marked with timestamp for audit trail.
# COMMENT 2026-04-20 RUN346: Migration already applied. Commenting out to prevent
# "already depended on by existing Durable Objects" Cloudflare API error.
# Keep for audit trail only; new migrations go BELOW this block.

# [[migrations]]
# tag = "v1-existing-dos-2026-04-20"
# new_sqlite_classes = ["SessionDO", "ProfileDO", "PetDO", "LedgerDO", "StudentBrainV2"]
# deleted_classes = []

# NEW migrations for classes not yet migrated
[[migrations]]
tag = "v2-student-brain-v2-2026-04-20"
new_sqlite_classes = ["StudentBrainV2"]
deleted_classes = []

# DNS route - requires naturalenglishtraining.com zone to be on this CF account first
# [[routes]]
# pattern = "www.naturalenglishtraining.com/*"
# zone_name = "naturalenglishtraining.com"

[assets]
directory = "./public"
binding = "ASSETS"

# Durable Objects moved to env-specific configs below

[triggers]
crons = ["0 */6 * * *"]

[vars]
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""
RETENTION_CRON_ENABLED = "true"
ESCALATION_SWEEP_INTERVAL_HOURS = "6"
NOTION_CHAT_MIRROR = "0"
NOTION_SOUL_DNA_DB_ENDPOINT = ""

# ── ENVIRONMENT-SPECIFIC CONFIGURATIONS ────────────────────

[env.production]
name = "net-pet-ai-production"

[env.production.vars]
APP_ENV = "production"
DEBUG = "false"
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""
RETENTION_CRON_ENABLED = "true"
ESCALATION_SWEEP_INTERVAL_HOURS = "6"
NOTION_CHAT_MIRROR = "0"
NOTION_SOUL_DNA_DB_ENDPOINT = ""

[[env.production.durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

[[env.production.durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileDO"

[[env.production.durable_objects.bindings]]
name = "PETS"
class_name = "PetDO"

[[env.production.durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[env.production.durable_objects.bindings]]
name = "STUDENT_BRAIN"
class_name = "StudentBrainV2"

# PRODUCTION SECRETS (encrypted on Cloudflare, not in repo):
# - DEEPSEEK_API_KEY
# - DEEPGRAM_API_KEY
# - NOTION_API_KEY
# - NOTION_LESSONS_DB (Durable)?
# - NOTION_PROGRESS_DB
# - NOTION_SOUL_DNA_DB
# Use: wrangler secret put <NAME> --env production

[env.development]
name = "net-pet-ai-dev"

[env.development.vars]
APP_ENV = "development"
DEBUG = "true"
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""
RETENTION_CRON_ENABLED = "true"
ESCALATION_SWEEP_INTERVAL_HOURS = "6"
NOTION_CHAT_MIRROR = "0"
NOTION_SOUL_DNA_DB_ENDPOINT = ""

[[env.development.durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

[[env.development.durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileDO"

[[env.development.durable_objects.bindings]]
name = "PETS"
class_name = "PetDO"

[[env.development.durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[env.development.durable_objects.bindings]]
name = "STUDENT_BRAIN"
class_name = "StudentBrainV2"

# DEVELOPMENT SECRETS (local, test-only):
# - DEEPSEEK_API_KEY (test key)
# - DEEPGRAM_API_KEY (test key)
# - NOTION_API_KEY (test workspace)
# Use: wrangler secret put <NAME> --env development