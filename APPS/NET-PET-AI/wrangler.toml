name = "net-pet-ai"
main = "src/index.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]

# DNS route - requires naturalenglishtraining.com zone to be on this CF account first
# [[routes]]
# pattern = "www.naturalenglishtraining.com/*"
# zone_name = "naturalenglishtraining.com"

# KV namespace for distributed rate limiting (survives worker restarts)
# To provision: wrangler kv namespace create RATELIMIT
# Then paste the returned id below
# [[kv_namespaces]]
# binding = "RATELIMIT"
# id = "<paste-id-here>"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileDO"

[[durable_objects.bindings]]
name = "PETS"
class_name = "PetDO"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[migrations]]
tag = "v1-net-pet-core"
new_sqlite_classes = ["SessionDO", "ProfileDO", "PetDO"]

[[migrations]]
tag = "v2-ledger"
new_sqlite_classes = ["LedgerDO"]

[[migrations]]
tag = "v4-ship-memory"
new_sqlite_classes = ["MemoryDO"]

[[migrations]]
tag = "v2-student-brain-v2-2026-04-20"
new_sqlite_classes = []

[[migrations]]
tag = "v5-drop-student-brain"
deleted_classes = ["StudentBrainV2"]

[vars]
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""