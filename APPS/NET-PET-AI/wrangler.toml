name = "net-pet-ai"
main = "src/index.js"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Custom domains pending DNS migration to Cloudflare (currently Squarespace)
# routes = [
#   { pattern = "naturalenglishtraining.com", custom_domain = true },
#   { pattern = "www.naturalenglishtraining.com", custom_domain = true },
# ]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "MEMORY"
class_name = "MemoryDO"

[[migrations]]
tag = "v4-ship-memory"
new_sqlite_classes = ["MemoryDO"]

[vars]
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
