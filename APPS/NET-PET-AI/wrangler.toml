name = "net-pet-ai"
main = "src/index.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]

# DNS route - requires naturalenglishtraining.com zone to be on this CF account first
# [[routes]]
# pattern = "www.naturalenglishtraining.com/*"
# zone_name = "naturalenglishtraining.com"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileDO"

[[durable_objects.bindings]]
name = "PETS"
class_name = "PetDO"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[durable_objects.bindings]]
name = "COMMANDS"
class_name = "CommandDO"

[[migrations]]
tag = "v1-net-pet-core"
new_sqlite_classes = ["SessionDO", "ProfileDO", "PetDO"]

[[migrations]]
tag = "v2-ledger"
new_sqlite_classes = ["LedgerDO"]

[[migrations]]
tag = "v4-ship-memory"
new_sqlite_classes = ["MemoryDO"]

[[migrations]]
tag = "v5-commands"
new_sqlite_classes = ["CommandDO"]

[vars]
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""

# Production environment — deploys as net-pet-ai-production
[env.production]
name = "net-pet-ai-production"

[env.production.vars]
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""