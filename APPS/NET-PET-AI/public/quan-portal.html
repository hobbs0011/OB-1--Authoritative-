```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUAN PORTAL â€” Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a12;
            --card: rgba(22, 22, 35, 0.85);
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.25);
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.25);
            --teal: #14b8a6;
            --teal-glow: rgba(20, 184, 166, 0.25);
            --text: #f8fafc;
            --dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--void);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 800px 600px at 15% 10%, var(--purple-glow), transparent 65%),
                radial-gradient(ellipse 700px 550px at 80% 85%, var(--gold-glow), transparent 60%),
                radial-gradient(ellipse 500px 400px at 50% 50%, rgba(20, 184, 166, 0.08), transparent 70%);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-8px);
            }
            30% {
                transform: translateX(8px);
            }
            45% {
                transform: translateX(-6px);
            }
            60% {
                transform: translateX(6px);
            }
            75% {
                transform: translateX(-3px);
            }
            90% {
                transform: translateX(3px);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.8;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s ease-in-out infinite;
            border-radius: 8px;
        }

        /* â”€â”€ LOGIN OVERLAY â”€â”€ */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(10, 10, 18, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.4s ease;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(168, 85, 247, 0.12) inset;
            animation: fadeIn 0.6s ease;
        }

        .login-card.shake {
            animation: shake 0.5s ease;
        }

        .login-crest {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.35));
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text);
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--dim);
            letter-spacing: 0.04em;
            margin-bottom: 28px;
        }

        .login-input-group {
            position: relative;
            margin-bottom: 6px;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.03em;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .login-input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .login-input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .login-error {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            color: var(--danger);
            min-height: 22px;
            line-height: 22px;
            margin-top: 4px;
            letter-spacing: 0.03em;
            transition: opacity 0.2s ease;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: var(--purple);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
            box-shadow: 0 6px 24px rgba(168, 85, 247, 0.3);
        }

        .login-btn:hover {
            background: #b871f8;
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.45);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.25);
        }

        /* â”€â”€ FIXED TOP NAV â”€â”€ */
        .portal-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 900;
            background: rgba(10, 10, 18, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .nav-brand-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.3));
        }

        .nav-brand-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            color: var(--text);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-link {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--dim);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            transition: color 0.2s ease, background 0.2s ease;
            white-space: nowrap;
            position: relative;
        }

        .nav-link:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-link.active {
            color: var(--purple);
            background: rgba(168, 85, 247, 0.1);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 14px;
            right: 14px;
            height: 2px;
            background: var(--purple);
            border-radius: 2px;
        }

        .nav-logout {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--dim);
            background: none;
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .nav-logout:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        /* â”€â”€ WATERMARK â”€â”€ */
        .portal-watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.055;
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: grayscale(40%);
        }

        /* â”€â”€ MAIN CONTENT â”€â”€ */
        .main-content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 88px 24px 60px;
            animation: fadeIn 0.5s ease;
        }

        .portal-header {
            margin-bottom: 32px;
        }

        .portal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .portal-header .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--dim);
            letter-spacing: 0.04em;
        }

        /* â”€â”€ STATS GRID â”€â”€ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .portal-header h1 {
                font-size: 1.8rem;
            }
            .nav-links {
                gap: 2px;
            }
            .nav-link {
                padding: 6px 10px;
                font-size: 0.78rem;
            }
            .nav-brand-text {
                font-size: 0.72rem;
            }
            .login-card {
                padding: 32px 24px 28px;
            }
            .login-title {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .main-content {
                padding: 80px 12px 40px;
            }
            .portal-nav {
                padding: 0 10px;
                height: 48px;
                gap: 8px;
            }
            .nav-link {
                padding: 5px 7px;
                font-size: 0.7rem;
                letter-spacing: 0.03em;
            }
            .nav-brand-text {
                font-size: 0.65rem;
                letter-spacing: 0.04em;
            }
            .nav-logout {
                font-size: 0.7rem;
                padding: 5px 10px;
            }
            .portal-header h1 {
                font-size: 1.5rem;
            }
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 18px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeIn 0.5s ease;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .stat-card .stat-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 3px 3px 0 0;
        }

        .stat-card.purple .stat-accent {
            background: var(--purple);
            box-shadow: 0 0 16px var(--purple-glow);
        }
        .stat-card.gold .stat-accent {
            background: var(--gold);
            box-shadow: 0 0 16px var(--gold-glow);
        }
        .stat-card.teal .stat-accent {
            background: var(--teal);
            box-shadow: 0 0 16px var(--teal-glow);
        }
        .stat-card.success .stat-accent {
            background: var(--success);
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.25);
        }

        .stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--dim);
            text-transform: uppercase;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-value.loading {
            color: transparent;
        }

        .stat-value .loading-placeholder {
            width: 60px;
            height: 28px;
            border-radius: 6px;
        }

        .stat-value.error {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: var(--dim);
            font-weight: 500;
        }

        /* â”€â”€ CARDS â”€â”€ */
        .content-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeIn 0.55s ease;
            margin-bottom: 20px;
        }

        .card-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--dim);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .teacher-note {
            border-left: 4px solid var(--teal);
            padding-left: 20px;
        }

        .teacher-note .note-body {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #d1d5db;
            font-style: italic;
            margin-bottom: 12px;
        }

        .teacher-note .note-signature {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--teal);
        }

        .milestone-card .milestone-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .milestone-badge {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .milestone-track {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.03em;
        }

        .milestone-progress-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            color: var(--dim);
            letter-spacing: 0.03em;
            margin-top: 6px;
        }

        .progress-bar-wrap {
            margin-top: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--gold));
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        /* â”€â”€ QUICK LINKS â”€â”€ */
        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        @media (max-width: 600px) {
            .quick-links-grid {
                grid-template-columns: 1fr;
            }
        }

        .quick-link-card {
            display: block;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px 18px;
            text-align: center;
            text-decoration: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            animation: fadeIn 0.6s ease;
        }

        .quick-link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
            border-color: rgba(168, 85, 247, 0.4);
        }

        .quick-link-icon {
            font-size: 1.6rem;
            margin-bottom: 8px;
            display: block;
        }

        .quick-link-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text);
        }

        .quick-link-sublabel {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            color: var(--dim);
            letter-spacing: 0.03em;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- â”€â”€ LOGIN OVERLAY â”€â”€ -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card" id="loginCard">
            <img
            src="./assets/brand/system-marks/phoenix-dna-crest-mark.png"
            alt="Phoenix DNA Crest"
            class="login-crest"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            >
            <div style="display:none; width:80px; height:80px; margin:0 auto 20px; border-radius:50%; background:rgba(168,85,247,0.15); border:2px solid rgba(168,85,247,0.3); display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-size:2rem; color:var(--purple);" aria-hidden="true">âš™</div>
            <h2 class="login-title">QUAN PORTAL</h2>
            <p class="login-subtitle">Natural English Training</p>
            <div class="login-input-group">
                <input
                type="password"
                id="portalPassword"
                class="login-input"
                placeholder="Enter portal password"
                autocomplete="off"
                aria-label="Portal password"
                >
            </div>
            <p class="login-error" id="loginError"></p>
            <button class="login-btn" id="loginBtn">UNLOCK PORTAL</button>
        </div>
    </div>

    <!-- â”€â”€ FIXED TOP NAV â”€â”€ -->
    <nav class="portal-nav" id="portalNav">
        <div class="nav-brand">
            <img
            src="./assets/brand/system-marks/phoenix-dna-crest-mark.png"
            alt="Crest"
            class="nav-brand-icon"
            onerror="this.style.display='none';"
            >
            <span class="nav-brand-text">QUAN PORTAL</span>
        </div>
        <div class="nav-links">
            <a href="quan-portal.html" class
