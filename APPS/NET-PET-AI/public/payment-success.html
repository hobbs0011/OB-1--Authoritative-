<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Confirmed — Natural English Training</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --card: rgba(34,197,94,0.08);
      --card-border: rgba(34,197,94,0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #111827 50%, #0a0e1a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .check-circle {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(34,197,94,0.15);
      border: 3px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }
    .check-circle span {
      font-size: 4rem;
      color: #22c55e;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      text-align: center;
      color: #22c55e;
      margin-bottom: 24px;
    }
    .summary-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      margin-bottom: 32px;
      backdrop-filter: blur(12px);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .summary-row:last-child { border-bottom: none; }
    .label { color: #94a3b8; font-size: 14px; }
    .value { font-weight: 600; color: #e2e8f0; font-size: 14px; }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f59e0b;
      max-width: 420px;
      width: 100%;
    }
    .steps {
      list-style: none;
      max-width: 420px;
      width: 100%;
      margin-bottom: 32px;
    }
    .steps li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      color: #cbd5e1;
    }
    .steps li .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(168,85,247,0.2);
      border: 1px solid rgba(168,85,247,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #a855f7;
    }
    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      width: 100%;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(168,85,247,0.15);
      border: 1px solid rgba(168,85,247,0.3);
      color: #a855f7;
    }
    .btn:hover { opacity: 0.85; }
    @media print {
      body { background: #fff; color: #111; }
      .actions, h1 { display: none; }
      .summary-card, .steps { box-shadow: none; border: 1px solid #e5e7eb; }
      .summary-card { page-break-inside: avoid; }
      .steps { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="check-circle"><span>✅</span></div>
    <h1>Payment Confirmed!</h1>

    <div class="summary-card" id="summary">
      <div class="summary-row"><span class="label">Plan</span><span class="value" id="plan">—</span></div>
      <div class="summary-row"><span class="label">Student</span><span class="value" id="student">—</span></div>
      <div class="summary-row"><span class="label">Amount</span><span class="value" id="amount">—</span></div>
      <div class="summary-row"><span class="label">Transaction ID</span><span class="value" id="txn">—</span></div>
      <div class="summary-row"><span class="label">Status</span><span class="value" style="color:#22c55e">Confirmed ✅</span></div>
    </div>

    <p class="section-title">What happens next</p>
    <ul class="steps">
      <li><span class="step-num">1</span> Your NET subscription is now active</li>
      <li><span class="step-num">2</span> Open your student portal to start learning</li>
      <li><span class="step-num">3</span Obi is ready — log in and start your first session</li>
    </ul>

    <div class="actions">
      <button class="btn btn-primary" id="goPortal" onclick="openPortal()">Go to My Portal →</button>
      <button class="btn btn-secondary" onclick="window.print()">Download Receipt</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'NET';
    const studentId = (params.get('studentId') || '').trim();
    const txnId = params.get('txnId') || '—';

    function formatStudent(id) {
      if (!id) return '—';
      return id.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function formatAmountVND(vnd) {
      return Number(vnd).toLocaleString('vi-VN') + ' VND';
    }

    document.getElementById('plan').textContent = plan;
    document.getElementById('student').textContent = formatStudent(studentId);
    document.getElementById('txn').textContent = txnId;

    // Read amount from URL or from state if already resolved
    const amountParam = params.get('amount');
    if (amountParam) {
      document.getElementById('amount').textContent = formatAmountVND(amountParam);
    } else if (studentId) {
      fetch('/api/payment/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentId, plan, amountVND: 0, txnId: 'resolve-only' })
      }).then(r => r.json()).then(d => {
        if (d.activatedUntil) document.getElementById('amount').textContent = 'Already Active';
        else document.getElementById('amount').textContent = '—';
      }).catch(() => { document.getElementById('amount').textContent = '—'; });
    } else {
      document.getElementById('amount').textContent = '—';
    }

    function openPortal() {
      if (studentId) {
        window.location.href = `/student/${studentId}`;
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
