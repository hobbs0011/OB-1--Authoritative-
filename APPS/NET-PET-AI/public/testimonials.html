<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Testimonials - Natural English Training">
  <meta property="og:description" content="Real stories from students who transformed their English with NET">
  <meta property="og:image" content="https://net-pet-ai.mrmichaelhobbs123.workers.dev/og-image.png">
  <meta property="og:url" content="https://net-pet-ai.mrmichaelhobbs123.workers.dev/testimonials">
  <meta property="og:type" content="website">
  <meta name="description" content="Read real success stories from Vietnamese students who improved their English with Natural English Training">
  <meta name="twitter:card" content="summary_large_image">
  <title>Testimonials - Natural English Training</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .testimonial-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .testimonial-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.2);
    }
  </style>
</head>
<body class="bg-[#0f172a] text-[#f3f4f6] min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex justify-between items-center mb-12">
      <a href="/" class="text-2xl font-bold text-white">NET PET AI</a>
    </div>

    <div class="text-center mb-16">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Student Stories</h1>
      <p class="text-lg text-[#94a3b8] max-w-3xl mx-auto">
        Real people, real progress. See how Vietnamese students transformed their English with NET.
      </p>
    </div>

    <div id="testimonials-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
      <div class="text-center py-12 col-span-3">
        <div class="animate-pulse text-[#64748b]">Loading testimonials...</div>
      </div>
    </div>

    <div class="max-w-2xl mx-auto bg-[#1e293b] border border-[#334155] rounded-xl p-8">
      <h2 class="text-2xl font-bold text-white mb-2">Share Your Story</h2>
      <p class="text-[#94a3b8] mb-4">Your journey can inspire others. Submit your testimonial below.</p>

      <form id="testimonial-form" class="space-y-4">
        <div>
          <input type="text" id="student-name" placeholder="Your name" required
            class="w-full px-4 py-3 bg-[#0f172a] border border-[#334155] rounded-lg text-white placeholder-[#64748b] focus:outline-none focus:border-[#a855f7]">
        </div>
        <div>
          <input type="text" id="student-location" placeholder="Your city (e.g., Ho Chi Minh City)"
            class="w-full px-4 py-3 bg-[#0f172a] border border-[#334155] rounded-lg text-white placeholder-[#64748b] focus:outline-none focus:border-[#a855f7]">
        </div>
        <div>
          <textarea id="testimonial-text" placeholder="Your story... What changed for you?" rows="4" required
            class="w-full px-4 py-3 bg-[#0f172a] border border-[#334155] rounded-lg text-white placeholder-[#64748b] focus:outline-none focus:border-[#a855f7] resize-none"></textarea>
        </div>
        <button type="submit"
          class="w-full bg-[#a855f7] hover:bg-[#9333ea] text-white font-semibold py-3 rounded-lg transition">
          Submit Testimonial
        </button>
      </form>
      <div id="form-success" class="hidden mt-4 p-4 bg-green-900/30 border border-green-700 rounded-lg text-green-300">
        Thank you! Your testimonial will be reviewed before publishing.
      </div>
    </div>
  </div>

  <script>
    async function loadTestimonials() {
      try {
        const res = await fetch('/api/testimonial');
        const data = await res.json();
        const container = document.getElementById('testimonials-container');

        if (!data.testimonials?.length) {
          container.innerHTML = '<p class="text-center text-[#64748b] col-span-3">No testimonials yet. Be the first!</p>';
          return;
        }

        container.innerHTML = data.testimonials.map(t => `
          <div class="testimonial-card rounded-xl p-6 flex flex-col h-full">
            <div class="flex-1 mb-4">
              <svg class="w-8 h-8 text-[#a855f7] mb-3" fill="currentColor" viewBox="0 0 24 24">
                <path d="M14.017 21.017L7.017 21C3.684 21 1.5 18.816 1.5 15.5c0-3.316 2.184-5.5 5.5-5.5h7.017v7.017z"/>
              </svg>
              <p class="text-[#e2e8f0]">${t.text}</p>
            </div>
            <div class="border-t border-[#334155] pt-4">
              <p class="font-semibold text-white">${t.name}</p>
              ${t.location ? `<p class="text-sm text-[#94a3b8]">${t.location}</p>` : ''}
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('testimonials-container').innerHTML =
          '<p class="text-center text-red-400 col-span-3">Failed to load testimonials.</p>';
      }
    }

    document.getElementById('testimonial-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('student-name').value,
        location: document.getElementById('student-location').value,
        text: document.getElementById('testimonial-text').value
      };
      try {
        await fetch('/api/testimonial', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        document.getElementById('testimonial-form').reset();
        document.getElementById('form-success').classList.remove('hidden');
        setTimeout(() => document.getElementById('form-success').classList.add('hidden'), 5000);
        loadTestimonials();
      } catch (err) {
        alert('Submission failed. Please try again.');
      }
    });

    loadTestimonials();
  </script>
</body>
</html>
