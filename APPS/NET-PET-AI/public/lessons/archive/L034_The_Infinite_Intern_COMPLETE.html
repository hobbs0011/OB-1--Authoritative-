        // ═══════════════════════════════════════════════════════════════
        // CONFETTI
        // ═══════════════════════════════════════════════════════════════
        function Confetti({ show, onComplete }) {
            useEffect(() => {
                if (!show) return;
                const canvas = document.getElementById('confetti');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const particles = [];
                const colors = ['#a855f7', '#f59e0b', '#ffffff'];
                for (let i = 0; i < 100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: -20,
                        size: Math.random() * 8 + 4,
                        speedY: Math.random() * 3 + 2,
                        speedX: Math.random() * 4 - 2,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        p.y += p.speedY;
                        p.x += p.speedX;
                    });
                    if (particles.every(p => p.y > canvas.height)) {
                        if (onComplete) onComplete();
                        return;
                    }
                    requestAnimationFrame(animate);
                }
                animate();
            }, [show]);
            return show ? <canvas id="confetti" className="confetti-canvas" /> : null;
        }

                            <div className={`p-6 rounded-xl ${
                                promptResult.status === 'success' ? 'bg-green-900 bg-opacity-30 border-2 border-green-500' :
                                promptResult.status === 'warn' ? 'bg-yellow-900 bg-opacity-30 border-2 border-yellow-500' :
                                'bg-red-900 bg-opacity-30 border-2 border-red-500'
                            }`}>
                                <p className="text-xl">{promptResult.msg}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
            
            // ═══════════════════════════════════════════════════════════════
            // SLIDE 9: MAGIC KEYS
            // ═══════════════════════════════════════════════════════════════
            const Slide9 = () => {
                const steps = [
                    { num: "1", label: "ROLE", text: "'Act as a BlueTech Manager...'" },
                    { num: "2", label: "TASK", text: "'Write an email to supplier...'" },
                    { num: "3", label: "TONE", text: "'Be polite but firm.'" }
                ];
                
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="glass-card rounded-3xl p-8 max-w-3xl w-full">
                            <h1 className="text-4xl font-black mb-4 text-center neon-glow" style={{color: '#a855f7'}}>
                                🔑 The 3 Magic Keys
                            </h1>
                            <p className="text-center mb-8 text-xl" style={{color: '#f59e0b'}}>
                                For BlueTech Executives
                            </p>
                            
                            {steps.map((step, i) => (
                                <div key={i} className="flex items-start mb-6 p-6 bg-slate-800 rounded-xl">
                                    <div className="text-5xl font-black mr-6" style={{color: '#a855f7'}}>
                                        {step.num}
                                    </div>
                                    <div>
                                        <h3 className="text-2xl font-bold mb-2" style={{color: '#f59e0b'}}>
                                            {step.label}
                                        </h3>
                                        <p className="text-xl">{step.text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };
            
            // ═══════════════════════════════════════════════════════════════
            // SLIDE 10: HOMEWORK & BUDDY
            // ═══════════════════════════════════════════════════════════════
            const Slide10 = () => (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass-card rounded-3xl p-8 max-w-4xl w-full">
                        <h1 className="text-4xl font-black mb-8 text-center neon-glow" style={{color: '#a855f7'}}>
                            📝 Week 1 Mission
                        </h1>
                        
                        <div className="grid md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-slate-800 p-6 rounded-xl">
                                <h3 className="text-2xl font-bold mb-4" style={{color: '#f59e0b'}}>
                                    📧 Homework
                                </h3>
                                <p className="text-lg mb-4">The Rude Email Challenge</p>
                                <div className="text-sm opacity-80 space-y-2">
                                    <p>1. Find a rude email</p>
                                    <p>2. Use AI to make it polite</p>
                                    <p>3. Send Before/After to Mr. Hobbs</p>
                                </div>
                                <p className="text-xs mt-4 opacity-50">
                                    (Tìm email thô lỗ → Dùng AI viết lịch sự → Gửi cho thầy)
                                </p>
                            </div>
                            
                            <div className="bg-slate-800 p-6 rounded-xl">
                                <h3 className="text-2xl font-bold mb-4" style={{color: '#a855f7'}}>
                                    👥 Buddy System
                                </h3>
                                <p className="text-sm mb-4">Choose your practice partner this week:</p>
                                <select 
                                    value={buddyPartner}
                                    onChange={(e) => setBuddyPartner(e.target.value)}
                                    className="mb-4"
                                >
                                    <option value="">Select buddy...</option>
                                    {STUDENT_LIST.map(s => (
                                        <option key={s} value={s}>{s}</option>
                                    ))}
                                </select>
                                <button
                                    onClick={saveBuddy}
                                    className="btn-primary w-full py-2 rounded-lg text-sm font-bold text-white"
                                >
                                    Save Buddy →
                                </button>
                                <p className="text-xs mt-3 opacity-50">
                                    Practice AI prompts together 15 min/day
                                </p>
                            </div>
                        </div>
                        
                        <div className="bg-gradient-to-r from-purple-900 to-slate-900 p-6 rounded-xl border-2 border-purple-500 text-center">
                            <p className="text-2xl font-bold mb-2" style={{color: '#f59e0b'}}>
                                🎯 Week 1 Goal
                            </p>
                            <p className="text-lg">
                                Master AI prompting for work emails
                            </p>
                        </div>
                    </div>
                </div>
            );
            
            // ═══════════════════════════════════════════════════════════════
            // RENDER
            // ═══════════════════════════════════════════════════════════════
            const slides = [Slide0, Slide1, Slide2, Slide3, Slide4, Slide5, Slide6, Slide7, Slide8, Slide9, Slide10];
            const CurrentSlide = slides[currentSlide];
            
            return (
                <div>
                    <CurrentSlide />
                    
                    <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 flex gap-4 z-50">
                        <button
                            onClick={() => setCurrentSlide(Math.max(0, currentSlide - 1))}
                            disabled={currentSlide === 0}
                            className="bg-purple-600 hover:bg-purple-700 disabled:opacity-30 px-6 py-3 rounded-xl font-bold text-white"
                        >
                            ← Back
                        </button>
                        
                        <div className="bg-slate-800 px-6 py-3 rounded-xl font-bold">
                            {currentSlide + 1} / {slides.length}
                        </div>
                        
                        <button
                            onClick={() => setCurrentSlide(Math.min(slides.length - 1, currentSlide + 1))}
                            disabled={currentSlide === slides.length - 1}
                            className="bg-purple-600 hover:bg-purple-700 disabled:opacity-30 px-6 py-3 rounded-xl font-bold text-white"
                        >
                            Next →
                        </button>
                    </div>
                    
                    <Confetti show={showConfetti} onComplete={() => setShowConfetti(false)} />
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
