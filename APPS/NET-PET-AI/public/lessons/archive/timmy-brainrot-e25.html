<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Timmy's Train Adventure — BrainRot Heroes E2.5</title>
<style>
:root{
--void:#0f0f1a;
--purple:#a855f7;
--gold:#f59e0b;
--ssGold:#ffd700;
--text:#e5e7eb;
--dim:#94a3b8;
--glass:rgba(26,26,38,.85);
--border:rgba(168,85,247,.35);
--borderG:rgba(245,158,11,.3);
--shadow:0 20px 70px rgba(0,0,0,.5);
--glowP:0 0 30px rgba(168,85,247,.5);
--glowG:0 0 25px rgba(245,158,11,.4);
--glowSS:0 0 45px rgba(255,215,0,.75);
--r:20px;
--ease:cubic-bezier(.2,.9,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
font-family:system-ui,-apple-system,sans-serif;
color:var(--text);
background:
radial-gradient(900px 700px at 10% 15%,rgba(168,85,247,.2),transparent 60%),
radial-gradient(900px 700px at 90% 80%,rgba(245,158,11,.15),transparent 60%),
var(--void);
}
.blob{
position:fixed;
border-radius:50%;
filter:blur(85px);
opacity:.5;
pointer-events:none;
animation:float 20s var(--ease) infinite;
}
.blob1{width:500px;height:500px;left:-150px;top:-150px;background:radial-gradient(circle,rgba(168,85,247,.9),transparent 70%)}
.blob2{width:450px;height:450px;right:-150px;bottom:-150px;background:radial-gradient(circle,rgba(245,158,11,.85),transparent 70%);animation-delay:7s}
@keyframes float{
0%,100%{transform:translate(0,0) scale(1)}
40%{transform:translate(50px,-40px) scale(1.05)}
75%{transform:translate(-30px,30px) scale(.96)}
}
.ss-overlay{
position:fixed;
inset:0;
pointer-events:none;
z-index:999;
opacity:0;
background:radial-gradient(circle,rgba(255,215,0,.25),transparent 75%);
box-shadow:inset 0 0 120px rgba(255,215,0,.6);
transition:opacity .3s ease;
}
.ss-overlay.active{
opacity:1;
animation:ssPulse .5s ease-in-out infinite alternate;
}
@keyframes ssPulse{
from{opacity:.85;transform:scale(1)}
to{opacity:1;transform:scale(1.02)}
}
.app{
position:relative;
z-index:1;
height:100%;
display:flex;
flex-direction:column;
}
.topbar{
padding:12px 16px;
background:rgba(15,15,26,.8);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
}
.brand{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}
.orb{
width:40px;
height:40px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,var(--gold),var(--purple) 45%,transparent 75%);
box-shadow:var(--glowP);
border:1px solid var(--borderG);
display:grid;
place-items:center;
}
.orb svg{width:20px;height:20px}
.title{
min-width:0;
}
.t1{
font-weight:900;
font-size:15px;
background:linear-gradient(135deg,var(--purple),var(--gold));
-webkit-background-clip:text;
background-clip:text;
color:transparent;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.t2{
font-size:11px;
color:rgba(203,213,225,.9);
font-family:monospace;
}
.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}
.pill{
padding:8px 12px;
background:rgba(26,26,38,.7);
border:1px solid var(--border);
border-radius:999px;
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}
.pill .dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--gold);
box-shadow:var(--glowG);
}
.btn{
padding:10px 14px;
background:rgba(26,26,38,.75);
border:1px solid var(--border);
border-radius:999px;
color:var(--text);
font-weight:700;
font-size:13px;
cursor:pointer;
display:flex;
align-items:center;
gap:8px;
transition:all .2s var(--ease);
}
.btn:hover{
transform:translateY(-2px);
box-shadow:var(--glowP);
border-color:var(--borderG);
}
.btn:active{transform:translateY(0)}
.btn.primary{
background:linear-gradient(135deg,var(--purple),var(--gold));
color:var(--void);
border-color:var(--borderG);
}
.btn.ss{
background:linear-gradient(135deg,var(--ssGold),#ff8c00);
color:var(--void);
border-color:rgba(255,215,0,.5);
box-shadow:var(--glowSS);
animation:ssBtnPulse 1.5s ease-in-out infinite;
}
@keyframes ssBtnPulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.06)}
}
.btn svg{width:16px;height:16px}
.stage{
flex:1;
padding:14px;
overflow:auto;
}
.deck{
max-width:900px;
margin:0 auto;
background:var(--glass);
border:1px solid var(--border);
border-radius:var(--r);
backdrop-filter:blur(14px);
box-shadow:var(--shadow);
overflow:hidden;
}
.deckTop{
padding:16px;
background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(245,158,11,.08));
border-bottom:1px solid rgba(168,85,247,.2);
}
.deckTop h2{
font-size:22px;
margin-bottom:6px;
}
.deckTop .kicker{
font-size:14px;
color:var(--dim);
}
.deckBody{
padding:20px;
}
.story{
font-size:16px;
line-height:1.75;
margin-bottom:20px;
}
.story p{margin-bottom:14px}
.story strong{color:var(--gold)}
.story em{color:var(--purple);font-style:normal}
.card{
background:rgba(15,15,26,.35);
border:1px solid rgba(168,85,247,.2);
border-radius:16px;
padding:16px;
margin-bottom:14px;
}
.card h3{
font-size:16px;
color:var(--gold);
margin-bottom:10px;
}
.card p{
font-size:14px;
color:var(--dim);
line-height:1.6;
margin-bottom:8px;
}
.card p:last-child{margin:0}
.choice{
background:rgba(26,26,38,.5);
border:2px solid var(--border);
border-radius:16px;
padding:14px;
margin-bottom:12px;
cursor:pointer;
transition:all .2s var(--ease);
}
.choice:hover{
transform:translateY(-2px);
border-color:var(--borderG);
box-shadow:0 0 25px rgba(168,85,247,.2);
}
.cTop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px;
}
.cName{
font-weight:900;
font-size:16px;
color:var(--gold);
}
.cTag{
font-size:12px;
font-family:monospace;
color:var(--gold);
}
.cDesc{
font-size:13px;
color:var(--dim);
line-height:1.5;
}
.panel{
margin-top:16px;
padding:16px;
background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(245,158,11,.08));
border:1px solid var(--borderG);
border-radius:16px;
}
.panel .big{
font-size:16px;
font-weight:900;
color:var(--gold);
margin-bottom:6px;
}
.panel .small{
font-size:13px;
color:rgba(226,232,240,.9);
}
.grid{
display:grid;
gap:14px;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}
.bottombar{
padding:12px 16px;
background:rgba(15,15,26,.6);
backdrop-filter:blur(12px);
border-top:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap;
}
.progress{
display:flex;
align-items:center;
gap:10px;
min-width:200px;
}
.bar{
flex:1;
height:10px;
background:rgba(148,163,184,.15);
border:1px solid var(--border);
border-radius:999px;
overflow:hidden;
}
.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--purple),var(--gold));
transition:width .4s var(--ease);
box-shadow:var(--glowP);
}
.ptext{
font-family:monospace;
font-size:12px;
color:rgba(226,232,240,.9);
white-space:nowrap;
}
.bbtns{
display:flex;
gap:10px;
}
.toast{
position:fixed;
left:50%;
bottom:80px;
transform:translateX(-50%);
background:rgba(26,26,38,.95);
border:1px solid var(--borderG);
border-radius:999px;
padding:12px 20px;
box-shadow:0 0 30px rgba(0,0,0,.5),var(--glowP);
color:var(--text);
font-weight:700;
font-size:14px;
z-index:10;
opacity:0;
pointer-events:none;
transition:opacity .3s ease;
}
.toast.show{
opacity:1;
animation:pop .3s var(--ease);
}
@keyframes pop{
from{transform:translateX(-50%) translateY(8px) scale(.96)}
to{transform:translateX(-50%) translateY(0) scale(1)}
}
.hidden{display:none!important}
@media(max-width:600px){
.topbar{padding:10px 12px}
.t1{font-size:13px}
.controls{gap:8px}
.btn{padding:8px 12px;font-size:12px}
.stage{padding:10px}
.deckBody{padding:16px}
}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="ss-overlay" id="ssOverlay"></div>

<div class="app">
<header class="topbar">
<div class="brand">
<div class="orb">

<div class="bbtns">

</button>
</div>
</footer>

<div class="toast" id="toast"></div>
</div>

},
renderVI(){
return`
<div class="story">

<p>Bạn làm được rồi! 99 ngày phiêu lưu!</p>

];

function render(){
const slide=SLIDES[state.slideIndex];
const content=state.lang==='en'?slide.renderEN():slide.renderVI();
$('#slideBody').innerHTML=content;
updateProgress();
updateLangTexts();
}

function updateProgress(){
const pct=((state.slideIndex+1)/SLIDES.length)*100;
$('#fill').style.width=pct+'%';
$('#ptext').textContent=`${state.slideIndex+1}/${SLIDES.length}`;
}

function updateLangTexts(){
$$('[data-en]').forEach(el=>{
const key=state.lang==='en'?'en':'vi';
el.textContent=el.dataset[key];
});
}

function showToast(msg){
const toast=$('#toast');
toast.textContent=msg;
toast.classList.add('show');
setTimeout(()=>toast.classList.remove('show'),2000);
}

function activateSS(){
if(state.ssActive)return;
state.ssActive=true;
const overlay=$('#ssOverlay');
overlay.classList.add('active');
showToast(state.lang==='en'?'⚡ SUPER SAIYAN MODE!':'⚡ CHẾ ĐỘ SUPER SAIYAN!');
setTimeout(()=>{
overlay.classList.remove('active');
state.ssActive=false;
showToast(state.lang==='en'?'SS Mode ended':'Chế độ SS kết thúc');
},10000);
}

document.addEventListener('click',e=>{
if(e.target.closest('#langBtn')){
state.lang=state.lang==='en'?'vi':'en';
render();
showToast(state.lang==='en'?'Switched to English':'Chuyển sang Tiếng Việt');
}
else if(e.target.closest('#ssBtn')){
activateSS();
}
else if(e.target.closest('#nextBtn')){
if(state.slideIndex<SLIDES.length-1){
state.slideIndex++;
render();
}
}
else if(e.target.closest('#prevBtn')){
if(state.slideIndex>0){
state.slideIndex--;
render();
}
}
else if(e.target.closest('[data-class]')){
const cls=e.target.closest('[data-class]').dataset.class;
state.chosenClass=cls;
$('#classChosen')?.classList.remove('hidden');
showToast(state.lang==='en'?`You chose ${cls}!`:`Bạn chọn ${cls}!`);
}
});

render();
})();
</script>
