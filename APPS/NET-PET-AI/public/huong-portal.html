<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUONG PORTAL — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a12;
            --card: rgba(22, 22, 35, 0.85);
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.25);
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.25);
            --teal: #14b8a6;
            --text: #f8fafc;
            --dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--void);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--void);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 15%, var(--purple-glow) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, var(--gold-glow) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 40%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            50%,
            90% {
                transform: translateX(-6px);
            }
            30%,
            70% {
                transform: translateX(6px);
            }
        }

        @keyframes progressPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(245, 158, 11, 0.4), inset 0 0 4px rgba(245, 158, 11, 0.2);
            }
            50% {
                box-shadow: 0 0 18px rgba(245, 158, 11, 0.7), inset 0 0 8px rgba(245, 158, 11, 0.35);
            }
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            border-radius: 8px;
            min-height: 28px;
            width: 100%;
        }

        .skeleton-sm {
            min-height: 20px;
            width: 60%;
        }

        .skeleton-lg {
            min-height: 40px;
            width: 80%;
        }

        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 18, 0.97);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.45s ease, visibility 0.45s ease;
            opacity: 1;
            visibility: visible;
        }

        html.auth-ready #loginScreen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #loginScreen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px var(--purple-glow);
            animation: fadeIn 0.5s ease;
        }

        .login-box.shaking {
            animation: shake 0.5s ease;
        }

        .login-crest {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: block;
            object-fit: contain;
        }

        .login-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text);
            margin-bottom: 6px;
        }

        .login-box .login-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--dim);
            letter-spacing: 0.04em;
            margin-bottom: 28px;
        }

        .login-box input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 16px;
            letter-spacing: 0.15em;
        }

        .login-box input[type="password"]:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .login-box input[type="password"]::placeholder {
            color: var(--dim);
            letter-spacing: 0.04em;
            opacity: 0.6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--purple), #9333ea);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #b86ef8, #a855f7);
            box-shadow: 0 6px 24px rgba(168, 85, 247, 0.45);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.25);
        }

        .login-error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 20px;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .login-error.visible {
            opacity: 1;
        }

        #topNav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            z-index: 9000;
            background: rgba(10, 10, 18, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            transition: opacity 0.4s ease;
        }

        html:not(.auth-ready) #topNav {
            opacity: 0;
            pointer-events: none;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
        }

        .nav-brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .nav-brand span {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        html.auth-ready .nav-links {
            opacity: 1;
        }

        .nav-links a {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--dim);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.25s ease;
            white-space: nowrap;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-links a.active {
            color: var(--gold);
            background: rgba(245, 158, 11, 0.08);
            box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.2);
        }

        .nav-logout {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #f87171;
            background: transparent;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            margin-left: 4px;
        }

        .nav-logout:hover {
            background: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.55);
            color: #fca5a5;
        }

        .portal-watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.055;
            width: 280px;
            height: 280px;
            object-fit: contain;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 110px 40px 60px;
            position: relative;
            z-index: 1;
        }

        .dashboard-header {
            margin-bottom: 36px;
            animation: fadeIn 0.5s ease;
        }

        .dashboard-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 6px;
        }

        .dashboard-header .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--dim);
            letter-spacing: 0.03em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
            animation: fadeIn 0.55s ease;
        }

        .stat-card {
            background: var(--card);
