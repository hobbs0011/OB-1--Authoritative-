<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscription — Natural English Training</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0a12;--card:rgba(22,22,35,0.9);--purple:#a855f7;--gold:#f59e0b;--teal:#14b8a6;--text:#f8fafc;--dim:#94a3b8;--border:rgba(255,255,255,0.08);--success:#22c55e;--error:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--void);color:var(--text);line-height:1.6;min-height:100vh;padding:2rem 1rem}
.container{max-width:640px;margin:0 auto}
h1{font-family:'Orbitron',monospace;font-size:1.6rem;margin-bottom:1.5rem;background:linear-gradient(to right,var(--purple),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:1.5rem;margin-bottom:1rem;backdrop-filter:blur(12px)}
.card h3{font-size:1.1rem;margin-bottom:.3rem}
.card .plan-name{color:var(--purple);font-weight:600;font-size:1.2rem}
.card .price{color:var(--dim);font-size:.9rem}
.status-badge{display:inline-block;padding:.25rem .75rem;border-radius:2rem;font-size:.75rem;font-weight:600}
.active{background:rgba(34,197,94,.12);color:var(--success);border:1px solid rgba(34,197,94,.2)}
.expired{background:rgba(239,68,68,.12);color:var(--error);border:1px solid rgba(239,68,68,.2)}
.trial{background:rgba(20,184,166,.12);color:var(--teal);border:1px solid rgba(20,184,166,.2)}
.none{background:rgba(148,163,184,.1);color:var(--dim);border:1px solid rgba(255,255,255,.08)}
.row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.9rem}
.row:last-child{border-bottom:none}
.row .label{color:var(--dim)}
.row .value{font-weight:500}
.cta{display:inline-block;margin-top:1rem;padding:.7rem 1.5rem;background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;border-radius:.5rem;font-weight:600;font-size:.9rem;text-decoration:none;text-align:center;width:100%}
.cta:hover{box-shadow:0 0 20px rgba(168,85,247,.35)}
.loading{text-align:center;padding:3rem;color:var(--dim)}
.error{text-align:center;padding:2rem;color:var(--error)}
#subStatus{display:none}
</style>
</head>
<body>
<div class="container">
<h1>My Subscription</h1>
<div id="subStatus" class="card"></div>
<a href="/pricing" class="cta">View Plans & Pricing →</a>
</div>
<script>
(async function(){
  const el = document.getElementById('subStatus');
  el.style.display = 'block';
  const sid = new URLSearchParams(location.search).get('studentId') || localStorage.getItem('studentId');
  if (!sid) {
    el.innerHTML = '<div class="error">No student ID. <a href="/" style="color:var(--gold)">Sign in</a></div>';
    return;
  }
  el.innerHTML = '<div class="loading">Loading subscription...</div>';
  try {
    const r = await fetch('/api/admin/subscription?studentId=' + sid + '&_t=' + Date.now());
    const d = await r.json();
    if (d.error) { el.innerHTML = '<div class="error">' + d.error + '</div>'; return; }
    const statusClass = d.status === 'active' ? 'active' : d.plan === 'trial' ? 'trial' : d.status === 'expired' ? 'expired' : 'none';
    const badge = `<span class="status-badge ${statusClass}">${d.status || 'no_subscription'}</span>`;
    const planDisplay = d.plan === 'none' ? 'No active plan' : d.plan;
    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:1rem">
        <div><div class="plan-name">${planDisplay}</div><div class="price">${badge}</div></div>
      </div>
      <div class="row"><span class="label">Plan</span><span class="value">${d.plan || '—'}</span></div>
      <div class="row"><span class="label">Status</span><span class="value">${badge}</span></div>
      ${d.is_founding_member ? '<div class="row"><span class="label">Founding Member</span><span class="value" style="color:var(--gold)">✓ Price locked forever</span></div>' : ''}
      ${d.trialDaysRemaining > 0 ? `<div class="row"><span class="label">Trial Days Left</span><span class="value" style="color:var(--teal)">${d.trialDaysRemaining} days</span></div>` : ''}
      ${d.paidUntil ? `<div class="row"><span class="label">Paid Until</span><span class="value">${new Date(d.paidUntil).toLocaleDateString()}</span></div>` : ''}
      ${d.activatedAt ? `<div class="row"><span class="label">Activated</span><span class="value">${new Date(d.activatedAt).toLocaleDateString()}</span></div>` : ''}
    `;
  } catch(e) {
    el.innerHTML = '<div class="error">Failed to load subscription. Try again.</div>';
  }
})();
</script>
</body>
</html>
