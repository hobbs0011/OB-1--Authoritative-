<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a12">
  <title>Quan & Quang — Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css">
  <style>
    .parent-shell { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
    .parent-header { margin-bottom: 24px; }
    .parent-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; color: #f8fafc; margin: 0 0 4px; }
    .parent-header p { color: #94a3b8; margin: 0; }
    .student-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .student-card { background: rgba(255,255,255,0.03); border: 1px solid #ffffff14; border-radius: 14px; padding: 16px; }
    .student-card h2 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin: 0 0 14px; color: #f8fafc; }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-box { background: #ffffff06; border: 1px solid #ffffff0d; border-radius: 10px; padding: 10px 12px; }
    .stat-box .label { font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-box .value { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin-top: 2px; }
    .daily-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: #ffffff05; border: 1px solid #ffffff0a; margin-bottom: 6px; }
    .daily-row .day { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: #e2e8f0; min-width: 70px; }
    .daily-row .bar-wrap { flex: 1; height: 8px; background: #ffffff14; border-radius: 99px; margin: 0 10px; overflow: hidden; }
    .daily-row .bar-fill { height: 100%; background: linear-gradient(90deg, #a855f7, #22c55e); border-radius: 99px; }
    .daily-row .mins { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #cbd5e1; min-width: 55px; text-align: right; }
    .task-list { margin-top: 12px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #ffffff05; border: 1px solid #ffffff0a; margin-bottom: 8px; }
    .task-item .title { font-weight: 600; color: #f8fafc; margin-bottom: 3px; }
    .task-item .meta { font-size: 0.78rem; color: #94a3b8; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.06em; }
    .badge-ok { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.35); }
    .badge-warn { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-miss { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .login-wrap { max-width: 360px; margin: 60px auto; background: #0a0a127a; border: 1px solid #ffffff14; border-radius: 14px; padding: 20px; backdrop-filter: blur(12px); }
    .login-wrap h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin: 0 0 6px; }
    .login-wrap p { color: #94a3b8; margin: 0 0 14px; font-size: 0.9rem; }
    .login-wrap input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ffffff22; background: #0a0a127a; color: #f8fafc; margin-bottom: 10px; }
    .login-wrap button { width: 100%; padding: 10px; border-radius: 10px; border: none; background: linear-gradient(135deg, #a855f7, #22c55e); color: #0a0a12; font-family: 'Orbitron', sans-serif; font-weight: 700; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="parent-shell">
    <div id="loginBlock" class="login-wrap">
      <h1>PARENT DASHBOARD</h1>
      <p>Enter your PIN to view Quan & Quang progress.</p>
      <input type="password" id="parentPin" placeholder="PIN" autocomplete="off">
      <button id="parentLoginBtn">LOGIN</button>
      <p id="parentLoginErr" style="color:#fca5a5;font-size:0.85rem;margin-top:8px;min-height:18px;"></p>
    </div>

    <div id="parentApp" class="hidden">
      <div class="parent-header">
        <h1>Quan & Quang</h1>
        <p>Weekly action plan · task completion · study minutes</p>
      </div>
      <div class="student-grid" id="studentGrid"></div>
    </div>
  </div>

  <script>
    const PARENT_PIN = 'net123456'; // TODO: move to env-bound backend; frontend PIN is placeholder-only
    async function api(url, options = {}) {
      const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function loadStudentCard(studentId, name) {
      const [tasksData, parentData] = await Promise.all([
        api('/api/parent/tasks?studentId=' + encodeURIComponent(studentId)),
        api('/api/parent/dashboard', { method: 'POST', body: JSON.stringify({ studentId, pin: PARENT_PIN }) }).catch(() => ({ ok: false })),
      ]);
      const summary = tasksData.summary || {};
      const today = tasksData.today || {};
      const dailyLog = tasksData.dailyLog || [];

      const card = document.createElement('div');
      card.className = 'student-card';
      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;">
          <h2>${name}</h2>
          <span class="badge ${summary.streak >= 5 ? 'badge-ok' : summary.streak >= 2 ? 'badge-warn' : 'badge-miss'}">${summary.streak || 0} day streak</span>
        </div>
        <div class="stat-row">
          <div class="stat-box"><div class="label">Tasks</div><div class="value">${summary.completedTasks || 0}/${summary.totalTasks || 0}</div></div>
          <div class="stat-box"><div class="label">Minutes</div><div class="value">${summary.totalMinutesLogged || 0}</div></div>
        </div>
        <div style="font-family:'Rajdhani',sans-serif;font-size:0.75rem;color:#cbd5e1;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Last 7 days</div>
        <div>
          ${dailyLog.map(d => {
            const pct = Math.min(100, Math.round((d.minutes / 60) * 100));
            return `<div class="daily-row"><div class="day">${d.day || d.date}</div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div><div class="mins">${d.minutes}m</div></div>`;
          }).join('')}
        </div>
        <div class="task-list">
          <div style="font-family:'Rajdhani',sans-serif;font-size:0.75rem;color:#cbd5e1;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Current tasks</div>
          ${(tasksData.tasks || []).map(t => `
            <div class="task-item">
              <div><div class="title">${t.title}</div><div class="meta">${t.category} · ${t.dailyMinutes} min · due ${t.dueDate || 'this week'}</div></div>
              <span class="badge ${t.status === 'completed' ? 'badge-ok' : 'badge-warn'}">${t.status || 'active'}</span>
            </div>
          `).join('')}
        </div>
      `;
      return card;
    }

    document.getElementById('parentLoginBtn').addEventListener('click', async () => {
      const pin = document.getElementById('parentPin').value.trim();
      const errEl = document.getElementById('parentLoginErr');
      if (pin !== PARENT_PIN) {
        errEl.textContent = 'Invalid PIN';
        return;
      }
      errEl.textContent = '';
      document.getElementById('loginBlock').classList.add('hidden');
      document.getElementById('parentApp').classList.remove('hidden');
      const grid = document.getElementById('studentGrid');
      try {
        const [quanCard, quangCard] = await Promise.all([
          loadStudentCard('quan-nguyen', 'Quan'),
          loadStudentCard('quang-nguyen', 'Quang'),
        ]);
        grid.appendChild(quanCard);
        grid.appendChild(quangCard);
      } catch (e) {
        console.error('parent load failed', e);
        grid.innerHTML = '<p style="color:#fca5a5">Failed to load student data.</p>';
      }
    });
  </script>
</body>
</html>
