<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="description" content="Natural English Training — AI English coach Obi. Mouse → Tiger. Speak English like a weapon, not a subject.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <title>Natural English Training — Obi</title>
  <style>
    :root {
      --void: #0f0f1a;
      --purple: #a855f7;
      --gold: #f59e0b;
      --glass: rgba(168, 85, 247, 0.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --bubble-obi: #1e1b4b;
      --bubble-student: #312e81;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--void);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(15, 15, 26, 0.95);
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--purple);
      flex: 1;
    }
    .obi-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    #dot.ok { background: #22c55e; }
    #speakToggle {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .row { display: flex; }
    .row-obi { justify-content: flex-start; }
    .row-student { justify-content: flex-end; }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    .bubble-obi {
      background: var(--bubble-obi);
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-bottom-left-radius: 4px;
    }
    .bubble-student {
      background: var(--bubble-student);
      border: 1px solid rgba(168, 85, 247, 0.1);
      border-bottom-right-radius: 4px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .typing span {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--purple);
      margin: 0 2px;
      animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    #inputBar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(15, 15, 26, 0.95);
      border-top: 1px solid rgba(168, 85, 247, 0.2);
      backdrop-filter: blur(10px);
    }
    #msg {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 24px;
      background: rgba(30, 27, 75, 0.5);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    #msg:focus { border-color: var(--purple); }
    #msg::placeholder { color: var(--muted); }
    #sendBtn, #mic {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    #sendBtn {
      background: var(--purple);
      color: white;
    }
    #sendBtn:hover { background: #9333ea; }
    #sendBtn:disabled { opacity: 0.4; cursor: default; }
    #mic {
      background: rgba(168, 85, 247, 0.15);
      color: var(--purple);
    }
    #mic:hover { background: rgba(168, 85, 247, 0.25); }
    #mic.mic-active {
      background: var(--purple);
      color: white;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(168, 85, 247, 0); } }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(168, 85, 247, 0.15);
      font-size: 12px;
      margin: 2px;
    }
    #welcome {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
      flex: 1;
    }
    #welcome.show { display: flex; }
    .welcome-logo { width: 96px; height: 96px; animation: fadeIn 0.6s ease; }
    .welcome-title {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome-sub { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 300px; }
    .badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeIn 0.8s ease;
    }
    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .badge-item.active { opacity: 1; }
    .badge-item img { width: 48px; height: 48px; }
    .badge-label { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <span id="dot" title="Checking..."></span>
    <img src="/icons/obi-avatar.svg" alt="Obi" class="obi-avatar">
    <h1>Natural English Training</h1>
    <button id="speakToggle" title="Obi voice ON">🔊</button>
  </header>
  <div id="welcome" class="show">
    <img src="/icons/icon.svg" alt="Natural English Training" class="welcome-logo">
    <div class="welcome-title">Meet Obi</div>
    <div class="welcome-sub">Your AI English coach. Mouse → Tiger.<br>Speak English like a weapon, not a subject.</div>
    <div class="badges">
      <div class="badge-item active"><img src="/icons/badge-mouse.svg" alt="Mouse"><span class="badge-label">Mouse</span></div>
      <div class="badge-item"><img src="/icons/badge-cat.svg" alt="Cat"><span class="badge-label">Cat</span></div>
      <div class="badge-item"><img src="/icons/badge-wolf.svg" alt="Wolf"><span class="badge-label">Wolf</span></div>
      <div class="badge-item"><img src="/icons/badge-tiger.svg" alt="Tiger"><span class="badge-label">Tiger</span></div>
    </div>
  </div>
  <div id="feed"></div>
  <form id="form" autocomplete="off">
    <div id="inputBar">
      <input id="msg" type="text" placeholder="Type here…" autocomplete="off">
      <button type="button" id="mic" title="Hold to speak">🎙️</button>
      <button type="submit" id="sendBtn">➤</button>
    </div>
  </form>
  <script src="/chat.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    }
    // Hide welcome screen when first message appears
    const welcomeEl = document.getElementById('welcome');
    const observer = new MutationObserver(function() {
      if (document.getElementById('feed').children.length > 0 && welcomeEl) {
        welcomeEl.classList.remove('show');
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('feed'), { childList: true });
  </script>
</body>
</html>
