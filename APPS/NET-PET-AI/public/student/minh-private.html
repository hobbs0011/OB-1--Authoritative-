<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minh — NET Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="avatar">🦕</div>
      <h1>Minh</h1>
      <p class="subtitle">Age 5 · Private Student</p>
      <span class="level-chip">A0 · BEGINNER</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-val loading" id="val-score">—</div><div class="stat-label">Tiger Score</div></div>
      <div class="stat"><div class="stat-val loading" id="val-streak">—</div><div class="stat-label">Streak</div></div>
      <div class="stat"><div class="stat-val loading" id="val-xp">—</div><div class="stat-label">XP</div></div>
      <div class="stat"><div class="stat-val loading" id="val-sessions">—</div><div class="stat-label">Sessions</div></div>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-badge mouse" id="status-badge">🐭 MOUSE MODE</span>
        <span class="score-big" id="score-big">0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="status-msg" id="status-msg">Loading...</p>
    </div>

    <div class="daily-card">
      <div class="section-label">Today's Mission</div>
      <div class="task-type-chip" id="task-type">—</div>
      <p class="task-prompt" id="task-prompt">Loading your task...</p>
      <div class="task-meta">
        <span id="task-focus">—</span>
        <span id="task-duration">—</span>
      </div>
    </div>

    <a href="/magic-chat.html?student=minh-private" class="cta">Start Session →</a>

    <div class="parent-card">
      <div class="section-label">Parent Report</div>
      <div class="parent-report" id="parent-report">Loading...</div>
    </div>

    <div class="profile-card">
      <div class="section-label">Profile</div>
      <div class="profile-row"><span class="profile-key">Goal</span><span class="profile-val" id="p-goals">—</span></div>
      <div class="profile-row"><span class="profile-key">Strength</span><span class="profile-val" id="p-strength">—</span></div>
      <div class="profile-row"><span class="profile-key">Motivation</span><span class="profile-val" id="p-trigger">—</span></div>
    </div>

    <a href="/magic-chat.html?student=minh-private" class="coach-link">⚡ Talk to Obi — Your Coach</a>
    <a href="/minh-action-plan.html" class="back-link">View Action Plan →</a>
  </div>

  <script>
    const studentId = 'minh-private';
    const BASE = 'https://net-pet-ai.mrmichaelhobbs123.workers.dev';
    function statusClass(s) { if (!s) return 'mouse'; if (s.includes('TIGER')) return 'tiger'; if (s.includes('CUB')) return 'cub'; return 'mouse'; }
    function statusLabel(s) { if (!s) return '🐭 MOUSE MODE'; if (s.includes('TIGER')) return '🐯 TIGER MODE'; if (s.includes('CUB')) return '🐻 CUB MODE'; return '🐭 MOUSE MODE'; }
    function setVal(id, val) { const el = document.getElementById(id); if (el) { el.textContent = val; el.classList.remove('loading'); } }
    async function loadAll() {
      try {
        const [tigerRes, petRes, dailyRes, profileRes, parentRes] = await Promise.all([
          fetch(`${BASE}/api/tiger-score?studentId=${studentId}`).then(r => r.json()),
          fetch(`${BASE}/api/netpet/state?studentId=${studentId}`).then(r => r.json()),
          fetch(`${BASE}/api/daily?studentId=${studentId}`).then(r => r.json()),
          fetch(`${BASE}/api/student/state?studentId=${studentId}`).then(r => r.json()),
          fetch(`${BASE}/api/parent/report?studentId=${studentId}`).then(r => r.json()),
        ]);
        const score = tigerRes.tigerScore ?? 0;
        setVal('val-score', score); setVal('val-streak', tigerRes.streak ?? 0);
        setVal('val-xp', petRes.state?.xp ?? 0); setVal('val-sessions', petRes.state?.totalSessions ?? 0);
        const status = tigerRes.status || 'MOUSE_MODE';
        const cls = statusClass(status);
        const badge = document.getElementById('status-badge');
        badge.textContent = statusLabel(status); badge.className = `status-badge ${cls}`;
        setVal('score-big', score);
        const fill = document.getElementById('progress-fill');
        fill.style.width = `${Math.min(score, 100)}%`; fill.className = `progress-fill ${cls}`;
        setVal('status-msg', dailyRes.message || '');
        if (dailyRes.task) {
          setVal('task-type', dailyRes.task.type || '—');
          setVal('task-prompt', dailyRes.task.prompt || '—');
          setVal('task-focus', `Focus: ${dailyRes.focus || '—'}`);
          setVal('task-duration', `${dailyRes.task.duration ?? '?'} min`);
        }
        const prof = profileRes.profile;
        if (prof) {
          setVal('p-goals', prof.goals || '—');
          setVal('p-strength', prof.confidence_areas || '—');
          setVal('p-trigger', prof.motivationNow || prof.fear_trigger || '—');
        }
        const pr = document.getElementById('parent-report');
        if (parentRes && !parentRes.error) {
          pr.textContent = parentRes.summary || parentRes.report || JSON.stringify(parentRes, null, 2);
        } else {
          pr.textContent = 'No report available yet.';
        }
      } catch (e) { document.getElementById('status-msg').textContent = 'Could not load data — check connection.'; }
    }
    loadAll();
  </script>
</body>
</html>
