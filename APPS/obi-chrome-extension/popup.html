<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBI — Natural English Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div id="obi-root">
    <header class="obi-header">
      <div class="obi-header-top">
        <h1>OBI</h1>
        <button id="speaker-toggle" class="obi-icon-btn" title="Toggle auto-speak">🔊</button>
      </div>
      <span class="obi-tagline">Natural English Training</span>
      <div class="obi-level-bar">
        <span id="level-label">🐭 Mouse</span>
        <div class="xp-track"><div id="xp-fill" class="xp-fill"></div></div>
        <span id="xp-count">0 XP</span>
      </div>
    </header>

    <div id="offline-banner" class="offline-banner hidden">
      📵 Offline — Gemini Nano only
    </div>

    <div id="chat-container">
      <div id="messages" class="obi-messages">
        <div class="message obi-message">
          <p>Hey! I'm OBI, your English tutor. 🐭→🐯</p>
          <p>Type anything in English or Vietnamese — I'll help you level up.</p>
        </div>
      </div>

      <div class="obi-input-area">
        <textarea id="user-input" placeholder="Type here... (English or Vietnamese)" rows="2"></textarea>
        <div class="obi-btn-group">
          <button id="mic-btn" class="obi-mic" title="Speak your message">🎤</button>
          <button id="send-btn" class="obi-send">Send</button>
        </div>
      </div>
    </div>

    <footer class="obi-footer">
      <button id="open-sidepanel" class="obi-link">Open Full Panel</button>
      <span class="obi-status" id="status-indicator">● Online</span>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
