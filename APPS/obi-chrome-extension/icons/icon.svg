<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>

  <!-- Void black background -->
  <rect width="128" height="128" fill="#0f0f1a" rx="16"/>

  <!-- Soul purple circle -->
  <circle cx="64" cy="64" r="58" fill="url(#circleGrad)"/>

  <!-- Inner dark overlay for depth -->
  <circle cx="64" cy="64" r="42" fill="rgba(15,15,26,0.5)"/>

  <!-- Imperial gold "O" -->
  <text
    x="64"
    y="64"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, serif"
    font-weight="bold"
    font-size="56"
    fill="#f59e0b"
    dy="2"
  >O</text>
</svg>
