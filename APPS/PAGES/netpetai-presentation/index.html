<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Natural English Training — Obi</title>
    <link rel="stylesheet" href="../../STYLES/gospel-444-tokens.css" />
    <link rel="stylesheet" href="../../STYLES/gospel-444-responsive.css" />
    <style>
      /* Gospel 444 Color: Void Black */
      :root {
        /* Use values from gospel-444-tokens.css */
        --radius: var(--radius-xl);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--void);
        color: var(--text);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: rgba(15, 15, 26, 0.95);
        border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        backdrop-filter: blur(10px);
        z-index: 10;
      }
      header h1 {
        font-size: var(--font-size-lg);
        font-weight: 600;
        color: var(--purple);
        flex: 1;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        transition: background 0.3s;
      }
      #dot.ok {
        background: #22c55e;
      }
      #speakToggle {
        background: none;
        border: none;
        font-size: var(--font-size-2xl);
        cursor: pointer;
        padding: 4px;
      }
      #feed {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
      }
      .row {
        display: flex;
      }
      .row-obi {
        justify-content: flex-start;
      }
      .row-student {
        justify-content: flex-end;
      }
      .bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: var(--font-size-base);
      }
      .bubble-obi {
        background: var(--bubble-obi);
        border: 1px solid rgba(168, 85, 247, 0.15);
        border-bottom-left-radius: 4px;
      }
      .bubble-student {
        background: var(--bubble-student);
        border: 1px solid rgba(168, 85, 247, 0.1);
        border-bottom-right-radius: 4px;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .typing span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--purple);
        margin: 0 2px;
        animation: bounce 1.4s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-6px);
        }
      }
      #inputBar {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: rgba(15, 15, 26, 0.95);
        border-top: 1px solid rgba(168, 85, 247, 0.2);
        backdrop-filter: blur(10px);
      }
      #msg {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 24px;
        background: rgba(30, 27, 75, 0.5);
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }
      #msg:focus {
        border-color: var(--purple);
      }
      #msg::placeholder {
        color: var(--muted);
      }
      #sendBtn,
      #mic {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        font-size: var(--font-size-xl);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      #sendBtn {
        background: var(--purple);
        color: white;
      }
      #sendBtn:hover {
        background: #9333ea;
      }
      #sendBtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #mic {
        background: rgba(168, 85, 247, 0.15);
        color: var(--purple);
      }
      #mic:hover {
        background: rgba(168, 85, 247, 0.25);
      }
      #mic.mic-active {
        background: var(--purple);
        color: white;
        animation: pulse 1s infinite;
      }
      #mic[data-listening="true"] {
        background: #22c55e;
        color: white;
        animation: pulse 1.5s infinite;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
      }
      #mic[data-listening="false"] {
        background: #fbbf24;
        color: white;
        animation: none;
        box-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(168, 85, 247, 0);
        }
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 8px;
        background: rgba(168, 85, 247, 0.15);
        font-size: var(--font-size-xs);
        margin: 2px;
      }

      /* ========== RESPONSIVE DESIGN (Mobile-First) ========== */
      body {
        max-width: 100%;
        padding: 0;
      }
      header {
        padding: var(--spacing-sm);
        font-size: var(--font-size-sm);
      }
      #feed {
        padding: var(--spacing-md);
        gap: var(--spacing-sm);
      }
      .bubble {
        max-width: 85%;
      }

      /* Tablet (640px+) */
      @media (min-width: 640px) {
        header {
          padding: var(--spacing-md);
        }
        #feed {
          padding: var(--spacing-lg);
          gap: var(--spacing-md);
        }
        .bubble {
          max-width: 75%;
        }
      }

      /* Laptop (1024px+) */
      @media (min-width: 1024px) {
        header {
          gap: var(--spacing-lg);
          padding: var(--spacing-lg);
        }
        #feed {
          max-width: var(--container-lg);
          margin: 0 auto;
        }
        .bubble {
          max-width: 60%;
        }
      }

      /* Desktop (1280px+) */
      @media (min-width: 1280px) {
        #feed {
          max-width: var(--container-xl);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" title="Checking..."></span>
      <h1>Natural English Training</h1>
      <button id="speakToggle" title="Obi voice ON">\uD83D\uDD0A</button>
    </header>
    <div id="feed"></div>
    <form id="form" autocomplete="off">
      <div id="inputBar">
        <input
          id="msg"
          type="text"
          placeholder="Type here\u2026"
          autocomplete="off"
        />
        <button type="button" id="mic" title="Hold to speak">
          \uD83C\uDF99\uFE0F
        </button>
        <button type="submit" id="sendBtn">\u27A4</button>
      </div>
    </form>
    <script src="/chat.js"></script>
    <script src="/assets/brand/system-marks/global-brand-shelf.js"></script>
  </body>
</html>
