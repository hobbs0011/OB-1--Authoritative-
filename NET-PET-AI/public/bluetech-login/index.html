<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta theme-color content="#0a1929">
  <title>BlueTech Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #030b14; --navy: #0a1929; --panel: rgba(10,25,41,0.68);
      --panel-border: rgba(0,163,224,0.18); --blue-bright: #00a3e0;
      --blue-glow: rgba(0,163,224,0.35); --white: #ffffff; --white-soft: #e6f2ff;
      --muted: #8aa8c7; --gold: #f0c060; --radius-lg: 22px; --radius-md: 16px; --radius-sm: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif; font-size: 1rem; line-height: 1.6;
      color: var(--white); background: var(--void); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(circle at 25% 30%, rgba(0,163,224,0.08), transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(0,86,179,0.10), transparent 45%);
    }
    .login-wrap { width: 100%; max-width: 420px; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-logo {
      width: 72px; height: 72px; border-radius: var(--radius-md);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 60px rgba(0,163,224,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
      background: transparent;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .brand-logo:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 70px rgba(0,163,224,0.28), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand h1 {
      font-family: 'Outfit', sans-serif; font-size: 1.45rem; font-weight: 600;
      letter-spacing: 0.06em; color: var(--white);
    }
    .brand p {
      color: var(--muted); font-size: 0.9rem; margin-top: 6px; font-weight: 300;
    }

    .card {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg); padding: 28px; margin-bottom: 14px;
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      box-shadow: 0 24px 64px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover {
      border-color: rgba(0,163,224,0.28);
      box-shadow: 0 28px 72px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .role-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px;
    }
    .role-btn {
      padding: 14px 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border); background: rgba(0,163,224,0.04);
      color: var(--muted); font-family: 'Outfit', sans-serif; font-weight: 600;
      font-size: 0.88rem; cursor: pointer; transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center; letter-spacing: 0.03em; position: relative; overflow: hidden;
    }
    .role-btn::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(0,163,224,0.1), rgba(0,86,179,0.08));
      opacity: 0; transition: opacity 0.3s;
    }
    .role-btn:hover::before { opacity: 1; }
    .role-btn:hover { border-color: rgba(0,163,224,0.4); color: var(--white); transform: translateY(-1px); }
    .role-btn.active {
      background: linear-gradient(135deg, rgba(0,163,224,0.22), rgba(0,86,179,0.18));
      color: var(--white); border-color: rgba(0,163,224,0.48);
      box-shadow: 0 0 24px rgba(0,163,224,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .pin-label {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
      transition: color 0.3s;
    }
    .pin-input {
      width: 100%; padding: 14px 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--panel-border); background: rgba(255,255,255,0.04);
      color: var(--white); font-family: 'Outfit', sans-serif; font-size: 1.1rem;
      letter-spacing: 0.3em; text-align: center; outline: none; transition: all 0.25s;
    }
    .pin-input:focus {
      border-color: var(--blue-bright);
      box-shadow: 0 0 0 3px rgba(0,163,224,0.14), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .login-btn {
      width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none;
      background: linear-gradient(135deg, var(--blue-bright), var(--blue));
      color: var(--white); font-family: 'Outfit', sans-serif; font-weight: 600;
      font-size: 0.95rem; letter-spacing: 0.06em; cursor: pointer;
      margin-top: 16px; transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 8px 24px rgba(0,163,224,0.22); position: relative; overflow: hidden;
    }
    .login-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }
    .login-btn:hover::before { left: 100%; }
    .login-btn:hover {
      box-shadow: 0 14px 36px rgba(0,163,224,0.35); transform: translateY(-1px);
    }
    .login-error {
      color: #ef4444; font-size: 0.85rem; text-align: center;
      margin-top: 12px; min-height: 20px;
    }
    .footer-note {
      text-align: center; font-size: 0.78rem; color: var(--muted);
      margin-top: 22px; opacity: 0.75; letter-spacing: 0.04em;
    }
    .net-badge {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
      padding: 6px 14px; border-radius: 100px;
      background: rgba(0,163,224,0.08); border: 1px solid rgba(0,163,224,0.22);
      color: rgba(255,255,255,0.7); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      transition: all 0.3s;
    }
    .net-badge:hover {
      border-color: rgba(0,163,224,0.4); box-shadow: 0 0 20px rgba(0,163,224,0.15);
    }
    .net-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--blue-bright); box-shadow: 0 0 8px var(--blue-glow);
      animation: pulse-dot 2.2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }

    /* Accountibility banner */
    .accountability-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.06), rgba(0,163,224,0.06));
      border: 1px solid rgba(245,158,11,0.18); border-radius: var(--radius-md);
      padding: 14px 18px; margin-bottom: 18px; display: flex;
      align-items: center; gap: 12px; transition: all 0.3s;
    }
    .accountability-banner:hover {
      border-color: rgba(245,158,11,0.3);
      box-shadow: 0 0 20px rgba(245,158,11,0.08);
    }
    .accountability-banner .icon { font-size: 1.4rem; flex-shrink: 0; }
    .accountability-banner .text {
      font-size: 0.88rem; color: rgba(255,255,255,0.8); line-height: 1.5;
    }
    .accountability-banner .text strong { color: var(--white); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-logo">
        <img src="/assets/brand/bluetech-logo.jpg" alt="BlueTech">
      </div>
      <h1>BLUETECH PORTAL</h1>
      <p>Your team’s English command center</p>
    </div>

    <div class="accountability-banner">
      <div class="icon">⚡</div>
      <div class="text">
        <strong>Investment protection:</strong> This program only works if employees do the work. 
        Consistent practice = real ROI. No practice = wasted investment.
      </div>
    </div>

    <div class="card">
      <div class="role-grid">
        <button class="role-btn active" data-role="student" onclick="selectRole('student')">Employee</button>
        <button class="role-btn" data-role="employer" onclick="selectRole('employer')">Employer</button>
        <button class="role-btn" data-role="teacher" onclick="selectRole('teacher')">Teacher</button>
      </div>
      <div class="pin-label" id="pinLabel">Employee PIN</div>
      <select id="studentSelect" class="pin-input" style="text-align:left;letter-spacing:0;display:none;margin-bottom:10px;">
        <option value="huong-bluetech">Huong</option>
        <option value="mai-tram-bluetech">Mai Tram</option>
        <option value="quy-bluetech">Quy</option>
      </select>
      <input type="password" id="pinInput" class="pin-input" placeholder="Enter PIN" autocomplete="off" maxlength="20">
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
      <p class="login-error" id="loginErr"></p>
    </div>
    <div style="text-align: center;">
      <p class="footer-note">Bluetech Ingredients Ltd. &middot; Lakeview City, Thu Duc, HCMC</p>
      <div class="net-badge">powered by NET</div>
    </div>
  </div>

  <script>
    const API = 'https://net-pet-ai.mrmichaelhobbs123.workers.dev';
    let selectedRole = 'student';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role));
      const labels = { student: 'Employee PIN', employer: 'Employer PIN', teacher: 'Teacher PIN' };
      document.getElementById('pinLabel').textContent = labels[role] || 'PIN';
      const studentSelect = document.getElementById('studentSelect');
      const pinInput = document.getElementById('pinInput');
      if (role === 'student') {
        studentSelect.style.display = 'block';
        pinInput.placeholder = 'Enter your PIN';
      } else {
        studentSelect.style.display = 'none';
        pinInput.placeholder = 'Enter PIN';
      }
      document.getElementById('loginErr').textContent = '';
    }

    async function doLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const errEl = document.getElementById('loginErr');
      if (!pin) { errEl.textContent = 'Enter your PIN'; return; }
      errEl.textContent = '';
      try {
        if (selectedRole === 'student') {
          const studentId = document.getElementById('studentSelect')?.value || 'bluetech';
          const r = await fetch(`${API}/api/student/checkpin`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ studentId, pin })
          });
          const d = await r.json();
          if (!d.ok) { errEl.textContent = d.error || 'Invalid PIN'; return; }
          const sid = d.studentId || studentId;
          localStorage.setItem('bluetech_session', JSON.stringify({ role: 'student', studentId: sid }));
          window.location.replace('/bluetech-' + sid.replace('bluetech-', '') + '/');
        } else if (selectedRole === 'employer') {
          const r = await fetch(`${API}/api/employer/checkpin`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });
          const d = await r.json();
          if (!d.ok) { errEl.textContent = d.error || 'Invalid PIN'; return; }
          localStorage.setItem('bluetech_session', JSON.stringify({ role: 'employer', employerCode: d.employerCode }));
          window.location.replace('/bluetech-employer/');
        } else if (selectedRole === 'teacher') {
          const r = await fetch(`${API}/api/teacher/checkpin`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });
          const d = await r.json();
          if (!d.ok) { errEl.textContent = d.error || 'Invalid PIN'; return; }
          localStorage.setItem('bluetech_session', JSON.stringify({ role: 'teacher' }));
          window.location.replace('/bluetech-teacher/');
        }
      } catch (e) {
        errEl.textContent = 'Network error';
      }
    }
    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
