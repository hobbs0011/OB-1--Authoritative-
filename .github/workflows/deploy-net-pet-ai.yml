name: Deploy NET-PET-AI Worker

on:
  push:
    branches: [canon]
    paths:
      - 'NET-PET-AI/**'
      - '.github/workflows/deploy-net-pet-ai.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy NET-PET-AI Worker (fixed bundle from deploy/)
        working-directory: NET-PET-AI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --name net-pet-ai

      - name: Guardrail - deepgram-token must return 200 with deepgram brain
        run: |
          sleep 15
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://net-pet-ai.mrmichaelhobbs123.workers.dev/api/deepgram-token?studentId=guardrail&mode=demo")
          echo "deepgram-token HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "GUARDRAIL FAILED - voice brain lock still broken"
            exit 1
          fi
          echo "GUARDRAIL PASSED - /api/deepgram-token returns 200"

      - name: Send Slack receipt
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"text\":\"NET-PET-AI deployed from commit ${{ github.sha }} by ${{ github.actor }}. Guardrail: deepgram-token 200.\"}"
          fi
