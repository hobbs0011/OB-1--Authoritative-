name: "Deploy Dev — net-pet-ai-dev"

on:
  push:
    branches:
      - master
    paths:
      - 'APPS/NET-PET-AI/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: APPS/NET-PET-AI/package-lock.json
      - name: Install dependencies
        working-directory: APPS/NET-PET-AI
        run: npm ci
      - name: Run tests
        working-directory: APPS/NET-PET-AI
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: APPS/NET-PET-AI/package-lock.json
      - name: Install dependencies
        working-directory: APPS/NET-PET-AI
        run: npm ci
      - name: Deploy to net-pet-ai-dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.dev.toml
          workingDirectory: APPS/NET-PET-AI
      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://net-pet-ai-dev.mrmichaelhobbs123.workers.dev/api/v1/health || echo "000")
          echo "Health check HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "net-pet-ai-dev live" || echo "WARNING: $STATUS"
