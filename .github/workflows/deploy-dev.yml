name: "Deploy Dev — net-pet-ai-dev"

on:
  push:
    branches:
      - master
    paths:
      - 'APPS/NET-PET-AI/**'
  workflow_dispatch:
    inputs:
      promote_prod:
        description: 'Promote to prod (canary 10%)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: APPS/NET-PET-AI/package-lock.json
      - name: Install dependencies
        working-directory: APPS/NET-PET-AI
        run: npm ci
      - name: Run tests
        working-directory: APPS/NET-PET-AI
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: APPS/NET-PET-AI/package-lock.json
      - name: Install dependencies
        working-directory: APPS/NET-PET-AI
        run: npm ci
      - name: Deploy to net-pet-ai-dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.dev.toml
          workingDirectory: APPS/NET-PET-AI
      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://net-pet-ai-dev.mrmichaelhobbs123.workers.dev/api/v1/health || echo "000")
          echo "Health check HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "net-pet-ai-dev live" || echo "WARNING: $STATUS"

  promote-prod:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' && inputs.promote_prod == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: APPS/NET-PET-AI/package-lock.json
      - name: Install dependencies
        working-directory: APPS/NET-PET-AI
        run: npm ci
      - name: Upload new version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config wrangler.toml
          workingDirectory: APPS/NET-PET-AI
      - name: Deploy canary 10%
        run: |
          echo "Version uploaded. To complete canary deploy:"
          echo "npx wrangler versions deploy --yes --percentage 10 --config APPS/NET-PET-AI/wrangler.toml"
          echo "Run manually to split traffic."
      - name: Full prod promote
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          workingDirectory: APPS/NET-PET-AI
