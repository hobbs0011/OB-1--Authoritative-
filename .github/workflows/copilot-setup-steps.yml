name: "Copilot Setup Steps"

# Runs automatically when this file changes (for easy validation),
# and can be triggered manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job name MUST be `copilot-setup-steps` — Copilot cloud agent looks for this exact name.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: APPS/NET-PET-AI/package-lock.json

      - name: Install NET-PET-AI dependencies (wrangler + devDeps)
        working-directory: APPS/NET-PET-AI
        run: npm ci

      - name: Validate Worker source (syntax check)
        working-directory: APPS/NET-PET-AI
        run: node --check src/index.js

      - name: Dry-run wrangler deploy (build gate)
        working-directory: APPS/NET-PET-AI
        run: npx wrangler deploy --dry-run --outdir /tmp/net-pet-ai-dry
