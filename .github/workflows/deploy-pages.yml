name: Deploy SITE to Cloudflare Pages

on:
  push:
    branches: ["canon"]
    paths: ["SITE/**", "docs/**"]
  workflow_dispatch:

concurrency:
  group: "cf-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync SITE to docs
        run: |
          rm -rf docs && cp -r SITE docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=naturalenglishtraining --branch=main --commit-dirty=true
