name: Secret Scan

on:
  pull_request:
  push:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin v8.24.2

      - name: Scan pull request history
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose

      - name: Scan pushed commit range
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            gitleaks git --config .gitleaks.toml --log-opts="--max-count=1" --redact --verbose
          else
            gitleaks git --config .gitleaks.toml --log-opts="${{ github.event.before }}..${{ github.sha }}" --redact --verbose
          fi

      - name: Scheduled full history scan
        if: github.event_name == 'schedule'
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose
