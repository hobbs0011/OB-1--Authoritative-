<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBI — Full Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/sidepanel.css">
</head>
<body>
  <div id="obi-panel">
    <header>
      <div class="obi-header-top">
        <h1>OBI</h1>
        <button id="speaker-toggle" class="obi-icon-btn" title="Toggle auto-speak">🔊</button>
      </div>
      <p class="subtitle">Natural English Training — Full Panel</p>
      <div class="obi-level-bar">
        <span id="level-label">🐭 Mouse</span>
        <div class="xp-track"><div id="xp-fill" class="xp-fill"></div></div>
        <span id="xp-count">0 XP</span>
      </div>
    </header>

    <div id="offline-banner" class="offline-banner hidden">
      📵 Offline — Gemini Nano only
    </div>

    <div id="panel-messages" class="messages"></div>

    <div class="input-area">
      <textarea id="panel-input" placeholder="Ask OBI anything..." rows="3"></textarea>
      <div class="controls">
        <button id="summarize-btn" title="Summarize pasted text">📋 Summarize</button>
        <button id="rewrite-btn" title="Simplify text for learning">✏️ Simplify</button>
        <button id="translate-btn" title="Translate selected text">🔄 Translate</button>
        <button id="mic-btn" class="obi-mic" title="Speak your message">🎤</button>
        <button id="panel-send" class="primary">Send</button>
      </div>
    </div>
  </div>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
