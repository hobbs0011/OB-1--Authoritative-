# ARCHIVE NOTE: Full 20-stage Phoenix Rising Protocol pipeline
# Preserved from mrmichaelhobbs1234-lang/phoenix-ob1 (27KB original)
# Worker URL references updated to hobbs-lab
# Stages: ignition -> repo-truth -> entrypoint -> migration-guard -> kv-truth ->
#   body-guard -> chaos-scan -> validator-truth -> dep-lock -> dry-run ->
#   hash-seal -> pre-deploy-probe -> deploy -> propagation -> smoke-health ->
#   smoke-ledger -> smoke-chat -> chaos-probe -> benchmark-record -> seal
name: Phoenix Rising Protocol — 20-Stage Chaos Magic

on:
  push:
    branches: [main]
    paths: ['src/**', 'validators/**', 'wrangler.toml', '.trigger']
  workflow_dispatch:

concurrency:
  group: deploy-phoenix-ob1
  cancel-in-progress: true

env:
  WORKER_URL: https://phoenix-ob1-system.hobbs-lab.workers.dev
  WORKER_NAME: phoenix-ob1-system
  NODE_VERSION: '20'

# Full 20-stage pipeline preserved in source repo
# See: github.com/mrmichaelhobbs1234-lang/phoenix-ob1/.github/workflows/phoenix-rising.yml
jobs:
  stage-01-ignition:
    name: S01 Ignition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Phoenix Rising Protocol initiated"
  stage-13-deploy:
    name: S13 Deploy
    runs-on: ubuntu-latest
    needs: stage-01-ignition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
          CLOUDFLARE_ACCOUNT_ID: $ secrets.CLOUDFLARE_ACCOUNT_ID 
        run: npx wrangler deploy
  stage-20-seal:
    name: S20 The Seal
    runs-on: ubuntu-latest
    needs: stage-13-deploy
    if: always()
    steps:
      - run: echo "Phoenix Rising Protocol — SEAL"
