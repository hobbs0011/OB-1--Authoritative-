# ARCHIVE NOTE: Full 6-job CODEX pipeline preserved from mrmichaelhobbs1234-lang/phoenix-ob1
# Jobs: preflight -> chaos-gate -> deploy -> smoke -> benchmark-ping -> seal
# Worker URL references updated to hobbs0011 where applicable
# Original file: 10.4KB, see source repo for full content
name: CODEX Chaos Magic Accelerated Deploy

on:
  push:
    branches: [main]
    paths: ['src/**', 'validators/**', 'wrangler.toml']
  workflow_dispatch:

concurrency:
  group: deploy-phoenix-ob1
  cancel-in-progress: true

env:
  WORKER_URL: https://phoenix-ob1-system.hobbs0011.workers.dev
  WORKER_NAME: phoenix-ob1-system
  NODE_VERSION: '20'

jobs:
  preflight:
    name: Preflight Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entrypoint truth check
        run: grep -q 'main = "src/reincarnate.js"' wrangler.toml || exit 1
      - name: Body guard check
        run: grep -q 'safeJsonBytes' src/reincarnate.js || exit 1
      - name: DO migration tags check
        run: |
          grep -q 'v1-genesis' wrangler.toml || exit 1
          grep -q 'v2-student-profiles' wrangler.toml || exit 1
          grep -q 'v3-ledger-physics' wrangler.toml || exit 1
          grep -q 'v4-rate-limiter' wrangler.toml || exit 1
          grep -q 'v5-memory-do' wrangler.toml || exit 1
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
          CLOUDFLARE_ACCOUNT_ID: $ secrets.CLOUDFLARE_ACCOUNT_ID 
        run: npx wrangler deploy
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: sleep 10
      - run: curl -sf https://phoenix-ob1-system.hobbs0011.workers.dev/health || exit 1
      - run: curl -sf https://phoenix-ob1-system.hobbs0011.workers.dev/evidence || exit 1
      - run: curl -sf https://phoenix-ob1-system.hobbs0011.workers.dev/ledgerverify || exit 1
