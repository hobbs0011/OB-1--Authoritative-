name: Chaos Deploy

concurrency:
  group: deploy-phoenix-ob1
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Pre-deploy gate
        run: grep -q "safeJsonBytes" src/reincarnate.js || exit 1
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: $ secrets.CLOUDFLARE_API_TOKEN 
        run: npx wrangler deploy
      - name: Post-deploy health check
        run: |
          sleep 5
          curl -f https://phoenix-ob1-system.hobbs0011.workers.dev/health || exit 1
      - name: Rollback on failure
        if: failure()
        run: |
          git config user.email "ci@phoenix-ob1"
          git config user.name "Phoenix CI"
          git revert HEAD --no-edit
          git push
          npx wrangler deploy
