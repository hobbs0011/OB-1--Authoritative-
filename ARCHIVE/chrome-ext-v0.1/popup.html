<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="obi-container">
    <header>
      <h1>🗣️ OBI</h1>
      <p class="subtitle">Natural English Training</p>
    </header>

    <div class="level-badge" id="level-badge">
      <span class="level-icon">🐭</span>
      <span class="level-text">Mouse Level</span>
      <span class="level-progress">0%</span>
    </div>

    <div id="chat-area" class="chat-area">
      <div class="message obi">
        <p>Hey! I'm OBI. Want to practice some English? Just type anything — there are no wrong answers here. 😊</p>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type in English..." autocomplete="off">
      <button id="send-btn">→</button>
    </div>

    <footer>
      <a href="https://www.naturalenglishtraining.com" target="_blank">naturalenglishtraining.com</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
