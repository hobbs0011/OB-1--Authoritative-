name = "net-pet-ai-production"
main = "src/index.js"
# NOTE: src/ is v1.6.0 (2026-04-20 GDRIVE snapshot). Production runs v1.6.2+v68.1-phase4-advanced.
# Delta: ~0.0.2 versions + phase6 cohort DOs (StudentProfileDO, CohortAnalysisDO) missing from src/.
# DO NOT DEPLOY without verifying the phase6 DO migration tags match the live slot.
# See README.md and wrangler-v160-reference.toml for full context.
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# === KNOWN DO BINDINGS (from /evidence endpoint + health check) ===
# Canon bindings (also in APPS/NET-PET-AI/wrangler.toml)
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileDO"

[[durable_objects.bindings]]
name = "PETS"
class_name = "PetDO"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[durable_objects.bindings]]
name = "COMMANDS"
class_name = "CommandDO"

# Production-only bindings (NOT in canon wrangler.toml)
# These must exist for the slot to function — removing them orphans live DO data.
[[durable_objects.bindings]]
name = "STUDENT_PROFILES"
class_name = "StudentProfileDO"

[[durable_objects.bindings]]
name = "COHORT_ANALYSIS"
class_name = "CohortAnalysisDO"

# Additional bindings likely present (exported by bundle — binding names unknown)
# AdaptiveDifficultyDO, AffiliateCommissionDO, CacheDO, ChurnModelDO,
# CohortRevenueTrackingDO, ControlledSynthesisDO, FastSealCursorDO,
# GitHubOAuthDO, HeavyLedger, LocalizationGatewayDO, MemoryDO,
# PetPersonalityDO, PheromoneTrailDO, QuotaEnforcementDO, RateLimiterDO,
# ReEngagementDO, RevenueCheckoutDO, SessionSubscriptionDO, StreakDO,
# StripeCheckoutDO, StudentBrainV2, StudentDO, StudentInfoDO, WebhookResilienceDO

# === MIGRATIONS (reconstructed from bundle analysis) ===
[[migrations]]
tag = "v1-net-pet-core"
new_sqlite_classes = ["SessionDO", "ProfileDO", "PetDO"]

[[migrations]]
tag = "v2-ledger"
new_sqlite_classes = ["LedgerDO"]

[[migrations]]
tag = "v4-ship-memory"
new_sqlite_classes = ["MemoryDO"]

# Additional migrations for production-only DOs — tags unknown
# [[migrations]]
# tag = "v??-phase6-cohort"
# new_sqlite_classes = ["StudentProfileDO", "CohortAnalysisDO"]

[vars]
APP_NAME = "Natural English Training"
APP_COACH_NAME = "Obi"
IMAGE_GEN_URL = ""
