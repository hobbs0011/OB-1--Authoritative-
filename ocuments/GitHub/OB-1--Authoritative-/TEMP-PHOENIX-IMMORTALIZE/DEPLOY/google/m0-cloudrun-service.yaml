apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: obi-m0
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/obi/obi-m0:latest
          ports:
            - containerPort: 8080
          env:
            - name: RUNTIME_PRIMARY
              value: google
            - name: MASTER_SYNC_REPO
              value: hobbs-lab/Phoenix-Rise-Immortalize-
            - name: MASTER_SYNC_PATH
              value: MASTER-SYNC.md
            - name: FIRESTORE_COLLECTION_PACKETS
              value: packets
            - name: FIRESTORE_COLLECTION_QUEUE
              value: queue
            - name: FIRESTORE_COLLECTION_DRIFT
              value: drift_map
